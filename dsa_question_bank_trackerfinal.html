<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DSA Question Bank Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0a0a0f; --surface:#111118; --surface2:#1a1a24; --border:#2a2a3a;
  --accent:#00b8d9; --accent2:#ff6b6b; --accent3:#43e97b; --accent4:#f7971e;
  --text:#e8e8f0; --text2:#888899; --text3:#555566;
  --lc:#ffa116; --gfg:#2f8d46; --done-bg:rgba(67,233,123,0.06);
  --gold:#ffd54a; --streak:#ff8a4c; --hh:230px;
}
* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--bg); color:var(--text); font-family:'Syne',sans-serif; min-height:100vh; overflow-x:hidden; }
body::before { content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E"); }

.header { position:sticky; top:0; z-index:100; background:rgba(10,10,15,0.92); backdrop-filter:blur(20px); border-bottom:1px solid var(--border); padding:1rem 1.5rem; }
.header-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:.75rem; }
.logo { display:flex; align-items:center; gap:.75rem; }
.logo-icon { width:36px; height:36px; background:var(--accent); border-radius:8px; display:flex; align-items:center; justify-content:center; font-family:'Space Mono',monospace; font-size:13px; font-weight:700; color:#001419; flex-shrink:0; }
.logo-text h1 { font-size:16px; font-weight:800; letter-spacing:-.3px; }
.logo-text p { font-size:11px; color:var(--text2); }
.header-stats { display:flex; gap:.6rem; align-items:center; flex-wrap:wrap; justify-content:flex-end; }
.stat-pill { background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:4px 12px; font-size:12px; display:flex; align-items:center; gap:6px; }
.stat-pill .num { font-family:'Space Mono',monospace; font-size:13px; font-weight:700; }
.stat-pill.done .num { color:var(--accent3); } .stat-pill.rem .num { color:var(--accent2); }
.stat-pill.pct .num { color:var(--accent); } .stat-pill.streak .num { color:var(--streak); }
.stat-pill.maxstreak .num, .stat-pill.star .num { color:var(--gold); }

.progress-track { height:3px; background:var(--border); border-radius:3px; overflow:hidden; margin-bottom:.75rem; }
.progress-fill { height:100%; background:linear-gradient(90deg,var(--accent),var(--accent3)); border-radius:3px; transition:width .4s ease; }

.dashboard-card { display:flex; align-items:center; gap:16px; background:linear-gradient(135deg,rgba(0,184,217,.08),rgba(255,138,76,.05)); border:1px solid var(--border); border-radius:10px; padding:9px 14px; margin-bottom:.75rem; flex-wrap:wrap; }
.streak-badge { display:flex; align-items:center; gap:7px; flex-shrink:0; }
.streak-flame { font-size:19px; filter:drop-shadow(0 0 5px rgba(255,138,76,.45)); }
.streak-badge-text { display:flex; flex-direction:column; line-height:1.15; }
.streak-num { font-family:'Space Mono',monospace; font-weight:700; font-size:17px; color:var(--streak); }
.streak-label { font-size:9px; font-weight:700; letter-spacing:.8px; text-transform:uppercase; color:var(--text3); }
.motivation-text { flex:1; min-width:180px; font-size:12.5px; font-weight:600; color:var(--text2); }
.mini-stats { display:flex; align-items:center; gap:14px; flex-shrink:0; }
.today-stat { font-family:'Space Mono',monospace; font-size:10.5px; font-weight:700; letter-spacing:.5px; color:var(--text3); display:flex; flex-direction:column; align-items:center; gap:1px; text-transform:uppercase; }
.today-stat .num { font-size:15px; color:var(--accent3); }
.activity-squares { display:flex; gap:3px; align-items:flex-end; }
.activity-sq { width:13px; height:13px; border-radius:3px; background:var(--border); transition:transform .15s; }
.activity-sq:hover { transform:scale(1.2); }
.activity-sq[data-level="1"] { background:rgba(67,233,123,.32); }
.activity-sq[data-level="2"] { background:rgba(67,233,123,.62); }
.activity-sq[data-level="3"] { background:rgba(67,233,123,.95); }
.activity-sq.today { box-shadow:0 0 0 1.5px var(--accent3); }

.controls { display:flex; gap:.5rem; flex-wrap:wrap; align-items:center; }
.search-wrap { position:relative; flex:1; min-width:200px; }
.search-wrap svg { position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--text3); pointer-events:none; }
#search { width:100%; background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:8px 10px 8px 34px; color:var(--text); font-family:'Syne',sans-serif; font-size:13px; outline:none; transition:border-color .2s; }
#search:focus { border-color:var(--accent); } #search::placeholder { color:var(--text3); }
.filter-group { display:flex; gap:4px; flex-wrap:wrap; }
.fbtn { background:var(--surface); border:1px solid var(--border); border-radius:7px; padding:7px 12px; font-size:12px; font-family:'Syne',sans-serif; font-weight:600; color:var(--text2); cursor:pointer; transition:all .15s; white-space:nowrap; }
.fbtn:hover { border-color:var(--accent); color:var(--text); }
.fbtn.on { background:var(--accent); border-color:var(--accent); color:#001419; }
.fbtn.on-done { background:var(--accent3); border-color:var(--accent3); color:#000; }
.fbtn.on-pend { background:var(--accent2); border-color:var(--accent2); color:#fff; }
.fbtn.on-star { background:linear-gradient(135deg,var(--gold),#f7971e); border-color:var(--gold); color:#1a1206; }
.fbtn.plan-on { background:var(--accent4); border-color:var(--accent4); color:#1a1206; }
.reset-btn { background:transparent; border:1px solid var(--border); border-radius:7px; padding:7px 12px; font-size:12px; font-family:'Syne',sans-serif; font-weight:600; color:var(--text3); cursor:pointer; transition:all .15s; }
.reset-btn:hover { border-color:var(--accent2); color:var(--accent2); }
.reset-btn.soft:hover { border-color:var(--accent); color:var(--accent); }

.main { display:flex; position:relative; z-index:1; }
.sidebar { width:240px; flex-shrink:0; position:sticky; top:var(--hh); height:calc(100vh - var(--hh)); overflow-y:auto; border-right:1px solid var(--border); padding:1rem; scrollbar-width:thin; scrollbar-color:var(--border) transparent; }
.sidebar-title { font-size:10px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; color:var(--text3); margin-bottom:.75rem; padding-left:4px; }
.step-btn { display:flex; align-items:center; justify-content:space-between; width:100%; background:transparent; border:none; border-radius:7px; padding:7px 8px; font-size:12px; font-family:'Syne',sans-serif; font-weight:600; color:var(--text2); cursor:pointer; transition:all .15s; text-align:left; margin-bottom:2px; }
.step-btn:hover { background:var(--surface2); color:var(--text); }
.step-btn.on { background:var(--surface2); color:var(--accent); border-left:2px solid var(--accent); padding-left:6px; }
.step-btn .step-name { flex:1; }
.step-btn .step-count { font-family:'Space Mono',monospace; font-size:10px; color:var(--text3); background:var(--border); border-radius:4px; padding:1px 5px; flex-shrink:0; }
.step-btn.on .step-count { background:rgba(0,184,217,.2); color:var(--accent); }

.content { flex:1; min-width:0; padding:1rem; }
.step-section { margin-bottom:1.5rem; }
.step-header { display:flex; align-items:center; gap:.75rem; margin-bottom:.75rem; padding:.75rem 1rem; background:var(--surface); border:1px solid var(--border); border-radius:10px; cursor:pointer; transition:border-color .2s; }
.step-header:hover { border-color:var(--accent); }
.step-num { font-family:'Space Mono',monospace; font-size:11px; font-weight:700; color:var(--accent); background:rgba(0,184,217,.12); border-radius:5px; padding:3px 7px; flex-shrink:0; }
.step-title { font-size:14px; font-weight:700; flex:1; }
.step-progress-text { font-family:'Space Mono',monospace; font-size:11px; color:var(--text2); flex-shrink:0; }
.step-mini-bar { width:60px; height:3px; background:var(--border); border-radius:3px; overflow:hidden; flex-shrink:0; }
.step-mini-fill { height:100%; background:var(--accent3); border-radius:3px; transition:width .3s; }
.step-chevron { color:var(--text3); transition:transform .2s; flex-shrink:0; }
.step-section.collapsed .step-chevron { transform:rotate(-90deg); }
.step-section.collapsed .problems-list { display:none; }

.problems-list { display:flex; flex-direction:column; gap:3px; }
.prob { display:flex; align-items:center; gap:10px; padding:9px 12px; background:var(--surface); border:1px solid var(--border); border-radius:8px; transition:all .15s; animation:fadeIn .2s ease; }
.prob:hover { background:var(--surface2); transform:translateX(2px); }
.prob.done { background:var(--done-bg); border-color:rgba(67,233,123,.15); opacity:.7; }
@keyframes fadeIn { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:translateY(0)} }

.cb-wrap { position:relative; flex-shrink:0; }
.cb-wrap input[type=checkbox] { appearance:none; -webkit-appearance:none; width:18px; height:18px; border:1.5px solid var(--border); border-radius:5px; cursor:pointer; background:var(--bg); transition:all .15s; display:block; }
.cb-wrap input[type=checkbox]:checked { background:var(--accent3); border-color:var(--accent3); }
.cb-wrap input[type=checkbox]:checked::after { content:'✓'; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:11px; color:#000; font-weight:700; }

.prob-num { font-family:'Space Mono',monospace; font-size:10px; color:var(--text3); min-width:26px; flex-shrink:0; }
.prob-name { flex:1; min-width:0; display:flex; flex-direction:column; gap:1px; }
.prob-title { font-size:13px; font-weight:600; color:var(--text); }
.prob.done .prob-title { text-decoration:line-through; color:var(--text3); }
.solved-date { font-size:10px; font-family:'Space Mono',monospace; color:var(--text3); cursor:default; }
.solved-date:hover { color:var(--accent3); }

.star-btn { width:24px; height:24px; flex-shrink:0; display:flex; align-items:center; justify-content:center; background:transparent; border:none; border-radius:6px; font-size:15px; line-height:1; color:var(--text3); cursor:pointer; transition:all .15s; }
.star-btn:hover { background:var(--surface2); color:var(--gold); }
.star-btn.starred { color:var(--gold); text-shadow:0 0 8px rgba(255,213,74,.55); animation:starPop .3s ease; }
@keyframes starPop { 0%{transform:scale(1)} 45%{transform:scale(1.35)} 100%{transform:scale(1)} }

.links { display:flex; gap:5px; flex-shrink:0; }
.lnk { display:inline-flex; align-items:center; gap:4px; padding:3px 9px; border-radius:5px; font-size:11px; font-weight:700; font-family:'Space Mono',monospace; text-decoration:none; transition:all .15s; white-space:nowrap; }
.lnk:hover { transform:translateY(-1px); }
.lnk-lc { background:rgba(255,161,22,.12); border:1px solid rgba(255,161,22,.25); color:var(--lc); }
.lnk-lc:hover { background:rgba(255,161,22,.2); }
.lnk-gfg { background:rgba(47,141,70,.15); border:1px solid rgba(47,141,70,.3); color:#4caf6e; }
.lnk-gfg:hover { background:rgba(47,141,70,.25); }
.lock { font-size:10px; margin-left:2px; }

.diff { font-size:9px; font-weight:700; letter-spacing:.5px; padding:2px 6px; border-radius:4px; flex-shrink:0; }
.diff.e { background:rgba(67,233,123,.1); color:var(--accent3); }
.diff.m { background:rgba(255,161,22,.1); color:var(--lc); }
.diff.h { background:rgba(255,107,107,.1); color:var(--accent2); }

/* CLICK COUNTER (solve / revise) */
.cnt-wrap { display:flex; align-items:center; gap:3px; flex-shrink:0; }
.cnt-btn { min-width:36px; height:26px; padding:0 7px; border:1.5px solid var(--border); border-radius:7px; background:var(--bg); color:var(--text3); font-family:'Space Mono',monospace; font-size:12px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all .15s; }
.cnt-btn:hover { border-color:var(--accent3); color:var(--accent3); }
.cnt-btn.has { background:var(--accent3); border-color:var(--accent3); color:#000; }
.cnt-btn.rev { background:var(--accent); border-color:var(--accent); color:#001419; }
.cnt-btn.has:hover, .cnt-btn.rev:hover { filter:brightness(1.12); color:#000; }
.cnt-mini { width:20px; height:20px; padding:0; border:none; border-radius:5px; background:transparent; color:var(--text3); font-size:13px; line-height:1; cursor:pointer; transition:all .15s; }
.cnt-mini:hover { background:var(--surface2); color:var(--accent2); }
.cnt-mini.hid { visibility:hidden; pointer-events:none; }
.hint { font-size:11.5px; color:var(--text2); background:var(--surface); border:1px dashed var(--border); border-radius:8px; padding:7px 12px; margin-bottom:1rem; line-height:1.5; }
.hint b { color:var(--text); font-family:'Space Mono',monospace; }

/* TODAY'S PLAN */
.plan { background:linear-gradient(135deg,rgba(247,151,30,.08),rgba(0,184,217,.05)); border:1px solid rgba(247,151,30,.35); border-radius:12px; padding:14px; margin-bottom:1.5rem; }
.plan h2 { font-size:14px; font-weight:800; margin-bottom:4px; }
.plan .sub { font-size:11.5px; color:var(--text2); margin-bottom:10px; }
.plan h3 { font-size:10px; letter-spacing:1.4px; text-transform:uppercase; color:var(--text3); margin:10px 0 6px; }
.plan .prob { margin-bottom:3px; }
.plan-note { font-size:11px; color:var(--text3); margin-top:10px; line-height:1.5; }
.pat-tag { font-size:9.5px; font-family:'Space Mono',monospace; color:var(--text3); }

.empty { text-align:center; padding:3rem 1rem; color:var(--text3); }
.empty svg { margin-bottom:1rem; opacity:.3; } .empty p { font-size:14px; }

::-webkit-scrollbar { width:5px; } ::-webkit-scrollbar-track { background:transparent; } ::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }

@media (max-width:768px) {
  .sidebar { display:none; }
  .header { padding:.75rem 1rem; }
  .header-top { flex-wrap:wrap; gap:.5rem; }
  .header-stats { width:100%; justify-content:flex-start; gap:6px; }
  .dashboard-card { flex-direction:column; align-items:flex-start; gap:8px; padding:10px 12px; }
  .motivation-text { font-size:11.5px; }
  .mini-stats { width:100%; justify-content:space-between; }
  .star-btn { width:30px; height:30px; font-size:17px; }
  .prob { flex-wrap:wrap; }
  .prob-title { font-size:12.5px; }
}
</style>
</head>
<body>

<header class="header" id="header">
  <div class="header-top">
    <div class="logo">
      <div class="logo-icon">QB</div>
      <div class="logo-text">
        <h1>DSA Question Bank Tracker</h1>
        <p id="header-sub">298 problems · 13 patterns · 5 new + 2 revision daily</p>
      </div>
    </div>
    <div class="header-stats">
      <div class="stat-pill done">✓ <span class="num" id="s-done">0</span> done</div>
      <div class="stat-pill rem">◎ <span class="num" id="s-rem">0</span> left</div>
      <div class="stat-pill streak">🔥 <span class="num" id="s-streak">0</span></div>
      <div class="stat-pill maxstreak">🏆 <span class="num" id="s-maxstreak">0</span></div>
      <div class="stat-pill star">⭐ <span class="num" id="s-star">0</span></div>
      <div class="stat-pill pct">⚡ <span class="num" id="s-pct">0%</span></div>
    </div>
  </div>
  <div class="progress-track"><div class="progress-fill" id="prog-fill" style="width:0%"></div></div>
  <div class="dashboard-card">
    <div class="streak-badge">
      <span class="streak-flame">🔥</span>
      <div class="streak-badge-text">
        <span class="streak-num" id="dash-streak-num">0</span>
        <span class="streak-label">day streak</span>
      </div>
    </div>
    <div class="motivation-text" id="dash-message"></div>
    <div class="mini-stats">
      <div class="today-stat">Today<span class="num" id="dash-today-num">0</span></div>
      <div class="activity-squares" id="activity-squares"></div>
    </div>
  </div>
  <div class="controls">
    <div class="search-wrap">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="search" placeholder="Search problems by name or number...">
    </div>
    <div class="filter-group">
      <button class="fbtn on" id="f-all" onclick="setFilter('all')">All</button>
      <button class="fbtn" id="f-pend" onclick="setFilter('pending')">Pending</button>
      <button class="fbtn" id="f-done" onclick="setFilter('done')">Done</button>
      <button class="fbtn" id="f-star" onclick="setFilter('starred')">⭐ Starred</button>
      <button class="fbtn" id="f-plan" onclick="togglePlan()">📅 Today's Plan</button>
    </div>
    <button class="reset-btn soft" onclick="exportData()" title="Download a backup of your progress">⬇ Backup</button>
    <button class="reset-btn soft" onclick="document.getElementById('imp').click()" title="Restore from a backup file">⬆ Restore</button>
    <input type="file" id="imp" accept="application/json" style="display:none">
    <button class="reset-btn" onclick="resetAll()">↺ Reset All</button>
  </div>
</header>

<div class="main">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="content" id="content"></div>
</div>

<script>
/* Format per line: Title|slug|difficulty(e/m/h)
   slug "~"  -> no LeetCode number in the PDF, opens a search link
   slug "$x" -> LeetCode Premium problem */
const RAW = [
["Array + Hashing", `
Two Sum|two-sum|e
Contains Duplicate|contains-duplicate|e
Valid Anagram|valid-anagram|e
Group Anagrams|group-anagrams|m
Intersection of Two Arrays|intersection-of-two-arrays|e
Intersection of Two Arrays II|intersection-of-two-arrays-ii|e
Majority Element|majority-element|e
Missing Number|missing-number|e
Single Number|single-number|e
Find All Numbers Disappeared in an Array|find-all-numbers-disappeared-in-an-array|e
Happy Number|happy-number|e
Isomorphic Strings|isomorphic-strings|e
Word Pattern|word-pattern|e
Longest Consecutive Sequence|longest-consecutive-sequence|m
Subarray Sum Equals K|subarray-sum-equals-k|m
Contiguous Array|contiguous-array|m
4Sum II|4sum-ii|m
Top K Frequent Elements|top-k-frequent-elements|m
Sort Characters By Frequency|sort-characters-by-frequency|m
First Unique Character in a String|first-unique-character-in-a-string|e
Ransom Note|ransom-note|e
Find the Difference|find-the-difference|e
Valid Sudoku|valid-sudoku|m
Maximum Number of Balloons|maximum-number-of-balloons|e`],
["Two Pointers", `
Two Sum II|two-sum-ii-input-array-is-sorted|m
Valid Palindrome|valid-palindrome|e
3Sum|3sum|m
3Sum Closest|3sum-closest|m
Container With Most Water|container-with-most-water|m
Remove Duplicates from Sorted Array|remove-duplicates-from-sorted-array|e
Remove Element|remove-element|e
Move Zeroes|move-zeroes|e
Squares of a Sorted Array|squares-of-a-sorted-array|e
Sort Colors|sort-colors|m
Reverse String|reverse-string|e
Reverse Vowels of a String|reverse-vowels-of-a-string|e
Is Subsequence|is-subsequence|e
Backspace String Compare|backspace-string-compare|e
Merge Sorted Array|merge-sorted-array|e
Boats to Save People|boats-to-save-people|m
Trapping Rain Water|trapping-rain-water|h
4Sum|4sum|m
Valid Palindrome II|valid-palindrome-ii|e
Partition Labels|partition-labels|m
Remove Duplicates from Sorted Array II|remove-duplicates-from-sorted-array-ii|m
Append Characters to String to Make Subsequence|append-characters-to-string-to-make-subsequence|m
Intersection of Two Arrays II|intersection-of-two-arrays-ii|e
Number of Subsequences That Satisfy the Given Sum Condition|number-of-subsequences-that-satisfy-the-given-sum-condition|m`],
["Sliding Window", `
Maximum Average Subarray I|maximum-average-subarray-i|e
Minimum Size Subarray Sum|minimum-size-subarray-sum|m
Longest Substring Without Repeating Characters|longest-substring-without-repeating-characters|m
Longest Repeating Character Replacement|longest-repeating-character-replacement|m
Permutation in String|permutation-in-string|m
Find All Anagrams in a String|find-all-anagrams-in-a-string|m
Minimum Window Substring|minimum-window-substring|h
Fruit Into Baskets|fruit-into-baskets|m
Max Consecutive Ones III|max-consecutive-ones-iii|m
Longest Subarray of 1's After Deleting One Element|longest-subarray-of-1s-after-deleting-one-element|m
Subarray Product Less Than K|subarray-product-less-than-k|m
Binary Subarrays With Sum|binary-subarrays-with-sum|m
Number of Subarrays with K Different Integers|subarrays-with-k-different-integers|h
Count Number of Nice Subarrays|count-number-of-nice-subarrays|m
Maximum Number of Vowels in a Substring|maximum-number-of-vowels-in-a-substring-of-given-length|m
Longest Substring with At Most K Distinct Characters|$longest-substring-with-at-most-k-distinct-characters|m
Longest Substring with At Most Two Distinct Characters|$longest-substring-with-at-most-two-distinct-characters|m
Minimum Operations to Reduce X to Zero|minimum-operations-to-reduce-x-to-zero|m
Frequency of the Most Frequent Element|frequency-of-the-most-frequent-element|m
Maximum Erasure Value|maximum-erasure-value|m
Grumpy Bookstore Owner|grumpy-bookstore-owner|m
Defuse the Bomb|defuse-the-bomb|e

/* Build DATA from RAW */
const DATA = [];
const BY_N = {};
(function build(){
  let n = 0;
  RAW.forEach((pat, i) => {
    const problems = pat[1].trim().split('\n').map(line => {
      const [t, slug, diff] = line.split('|');
      n++;
      let l = '', g = '', prem = false;
      if(slug === '~') {
        g = 'https://www.google.com/search?q=' + encodeURIComponent(t + ' geeksforgeeks');
      } else {
        prem = slug.startsWith('$');
        l = 'https://leetcode.com/problems/' + slug.replace('$','') + '/description/';
      }
      const p = { n, t, diff, l, g, prem, step: i + 1, stepName: pat[0] };
      BY_N[n] = p;
      return p;
    });
    DATA.push({ id: i + 1, name: pat[0], problems });
  });
})();
const TOTAL = Object.keys(BY_N).length;

/* ======================= STATE ======================= */
const STORAGE_KEY = 'dsa_question_bank_progress_v1';
let state = { version: 1, problems: {}, maxStreak: 0, collapsedSteps: {} };
let filter = 'all';
let activeStep = 'all';
let planOpen = false;

// count = total times the question was done (1 = solved, 2+ = revisions); log = date of each click.
function emptyProblemState() { return { done:false, count:0, log:[], firstSolvedDate:null, completedOn:null, starred:false }; }
function migrateProblems(obj) {
  Object.keys(obj).forEach(k => {
    const ps = obj[k];
    if(!ps) return;
    if(typeof ps.count !== 'number') {
      const d = ps.completedOn || ps.firstSolvedDate;
      ps.count = ps.done ? 1 : 0;
      ps.log = (ps.done && d) ? [d] : [];
    }
    if(!Array.isArray(ps.log)) ps.log = [];
  });
  return obj;
}
function getCount(n) { return (getProblemState(n).count) || 0; }
function counterHtml(n) {
  const c = getCount(n);
  const label = c === 0 ? '＋' : c === 1 ? '✓' : 'R' + (c - 1);
  const cls = c === 0 ? '' : c === 1 ? ' has' : ' rev';
  const tip = c === 0 ? 'Click: mark as solved'
    : c === 1 ? 'Solved. Click again to log a revision'
    : 'Solved + revised ' + (c - 1) + '×. Click to log another revision';
  return `<div class="cnt-wrap"><button type="button" class="cnt-btn${cls}" onclick="bumpProblem(${n})" title="${tip}">${label}</button>`
    + `<button type="button" class="cnt-mini${c?'':' hid'}" onclick="decProblem(${n})" title="Undo last click">−</button>`
    + `<button type="button" class="cnt-mini${c?'':' hid'}" onclick="resetProblem(${n})" title="Reset this question">↺</button></div>`;
}
function dateHtmlFor(ps) {
  if(!ps.done) return '';
  let t = ps.firstSolvedDate ? 'Solved ' + formatDate(ps.firstSolvedDate) : 'Solved';
  const r = (ps.count || 1) - 1;
  if(r > 0) {
    t += ` · Revised ${r}×`;
    if(ps.completedOn && ps.completedOn !== ps.firstSolvedDate) t += ` · last ${formatDate(ps.completedOn)}`;
  }
  const full = (ps.log || []).map(formatDate).join(', ');
  return `<span class="solved-date" title="${esc(full)}">${t}</span>`;
}
function hintHtml() {
  return `<div class="hint">Click <b>＋</b> = solved <b>✓</b> · click again = revision <b>R1, R2…</b> · <b>−</b> undo last click · <b>↺</b> reset that question</div>`;
}
function saveState() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {} }
function normalizeState(parsed) {
  return {
    version: 1,
    problems: migrateProblems((parsed && parsed.problems) || {}),
    maxStreak: parsed && typeof parsed.maxStreak === 'number' ? parsed.maxStreak : 0,
    collapsedSteps: parsed && parsed.collapsedSteps && typeof parsed.collapsedSteps === 'object' ? parsed.collapsedSteps : {}
  };
}
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) { state = normalizeState(JSON.parse(raw)); return; }
  } catch(e) {}
  state = { version: 1, problems: {}, maxStreak: 0, collapsedSteps: {} };
}

/* ======================= HELPERS ======================= */
function getProblemState(n) { return state.problems[n] || emptyProblemState(); }
function isProblemDone(n) { return !!getProblemState(n).done; }
function dateKeyFromDate(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function getTodayKey() { return dateKeyFromDate(new Date()); }
function formatDate(k) {
  if(!k) return '';
  const [y,m,d] = k.split('-').map(Number);
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${months[m-1]} ${d}, ${y}`;
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function getDailyActivity() {
  const map = {};
  Object.values(state.problems).forEach(ps => {
    (ps.log || []).forEach(d => { map[d] = (map[d] || 0) + 1; }); // every solve/revision click counts as activity
  });
  return map;
}
function calculateCurrentStreak(activity) {
  activity = activity || getDailyActivity();
  let streak = 0;
  const d = new Date();
  // If nothing solved yet today, the streak is still alive until midnight: count from yesterday.
  if(!(activity[dateKeyFromDate(d)] > 0)) d.setDate(d.getDate() - 1);
  while(activity[dateKeyFromDate(d)] > 0) { streak++; d.setDate(d.getDate() - 1); }
  return streak;
}
function calculateMaxStreak(activity) {
  activity = activity || getDailyActivity();
  const keys = Object.keys(activity).filter(k => activity[k] > 0).sort();
  let longest = 0, run = 0, prev = null;
  keys.forEach(k => {
    const [y,m,d] = k.split('-').map(Number);
    const cur = new Date(y, m-1, d);
    run = (prev && Math.round((cur - prev)/86400000) === 1) ? run + 1 : 1;
    longest = Math.max(longest, run);
    prev = cur;
  });
  const best = Math.max(longest, calculateCurrentStreak(activity), state.maxStreak || 0);
  if(best > (state.maxStreak || 0)) { state.maxStreak = best; saveState(); }
  return state.maxStreak || 0;
}
function getMotivationMessage(streak, doneCount) {
  if(doneCount === TOTAL) return `🏆 ${TOTAL}/${TOTAL} — Question bank finished. Now revise the starred problems.`;
  if(doneCount === 0) return `🚀 Start with just ONE problem today. Consistency beats intensity.`;
  if(streak === 0) return `🔄 Yesterday was history. Start again today with one problem.`;
  if(streak <= 2) return `🔥 You're building the habit. Don't break the chain.`;
  if(streak <= 6) return `💪 Discipline is forming. Keep showing up.`;
  if(streak <= 13) return `⚡ One week strong. Your consistency is becoming a skill.`;
  if(streak <= 29) return `🏆 Two weeks+ of discipline. Keep pushing.`;
  return `👑 30+ day streak. This is serious consistency.`;
}
function doneProbsForStep(step) { return step.problems.filter(p => isProblemDone(p.n)).length; }

/* ======================= MUTATIONS ======================= */
function syncDerived(ps) {
  ps.count = Math.max(0, ps.count || 0);
  ps.done = ps.count >= 1;
  ps.firstSolvedDate = ps.log.length ? ps.log[0] : (ps.done ? ps.firstSolvedDate : null);
  ps.completedOn = ps.log.length ? ps.log[ps.log.length - 1] : null;
  return ps;
}
function mutateProblem(n, fn) {
  const ps = Object.assign(emptyProblemState(), state.problems[n]);
  ps.log = (ps.log || []).slice();
  fn(ps);
  syncDerived(ps);
  state.problems[n] = ps;
  saveState();
  refreshAll();
}
function bumpProblem(n) {   // 1st click = solved, every next click = one more revision
  mutateProblem(n, ps => { ps.count++; ps.log.push(getTodayKey()); });
}
function decProblem(n) {    // undo the last click
  mutateProblem(n, ps => {
    if(ps.count > 0) { ps.count--; if(ps.log.length > ps.count) ps.log.pop(); }
    if(ps.count === 0) ps.log = [];
  });
}
function resetProblem(n) {  // back to 0 for this one question (star is kept)
  if(getCount(n) > 1 && !confirm('Reset this question to 0? Its solve and revision dates will be cleared.')) return;
  mutateProblem(n, ps => { ps.count = 0; ps.log = []; });
}
function toggleStar(n, evt) {
  if(evt) evt.stopPropagation();
  const ps = Object.assign(emptyProblemState(), state.problems[n]);
  ps.starred = !ps.starred;
  state.problems[n] = ps;
  saveState();
  refreshAll();
}
function resetAll() {
  if(!confirm('Reset all progress, dates, stars and streak history? This cannot be undone.')) return;
  state = { version: 1, problems: {}, maxStreak: 0, collapsedSteps: state.collapsedSteps || {} };
  saveState();
  setFilter('all');
}
function exportData() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'dsa-question-bank-backup-' + getTodayKey() + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
document.getElementById('imp').addEventListener('change', e => {
  const f = e.target.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const parsed = JSON.parse(r.result);
      if(!parsed || typeof parsed.problems !== 'object') throw new Error('bad');
      if(!confirm('Replace current progress with this backup?')) return;
      state = normalizeState(parsed);
      saveState();
      refreshAll();
    } catch(err) { alert('That file is not a valid backup.'); }
  };
  r.readAsText(f);
  e.target.value = '';
});

/* ======================= TODAY'S PLAN ======================= */
function seededPick(arr, count, seed) {
  const pool = arr.slice(), out = [];
  let s = seed;
  while(out.length < count && pool.length) {
    s = (s * 1103515245 + 12345) & 0x7fffffff;
    out.push(pool.splice(s % pool.length, 1)[0]);
  }
  return out;
}
function planRow(p, withCheckbox) {
  const ps = getProblemState(p.n);
  let links = '';
  if(p.l) links += `<a class="lnk lnk-lc" href="${p.l}" target="_blank" rel="noopener">LC ↗</a>`;
  if(p.g) links += `<a class="lnk lnk-gfg" href="${p.g}" target="_blank" rel="noopener">Search ↗</a>`;
  const dl = p.diff === 'e' ? 'Easy' : p.diff === 'm' ? 'Med' : 'Hard';
  return `<div class="prob${ps.done?' done':''}">
    ${counterHtml(p.n)}
    <span class="prob-num">${p.n}</span>
    <div class="prob-name"><span class="prob-title">${esc(p.t)}</span><span class="pat-tag">${esc(p.stepName)}</span></div>
    <span class="diff ${p.diff}">${dl}</span><div class="links">${links}</div></div>`;
}
function buildPlanHtml() {
  const all = Object.values(BY_N).sort((a,b) => a.n - b.n);
  const today = getTodayKey();
  // New: next 5 in sequence, plus anything already finished today so the list stays stable.
  const doneToday = all.filter(p => { const s = getProblemState(p.n); return s.done && s.firstSolvedDate === today; });
  const pending = all.filter(p => !isProblemDone(p.n));
  const slots = Math.max(0, 5 - doneToday.length);
  const newOnes = doneToday.concat(pending.slice(0, slots));
  // Revision: 2 older solved problems, picked deterministically per day.
  const oldDone = all.filter(p => { const s = getProblemState(p.n); return s.done && s.firstSolvedDate !== today; });
  const seed = parseInt(today.replace(/-/g,''), 10);
  const revise = seededPick(oldDone, 2, seed);

  let h = `<div class="plan"><h2>📅 Today's Plan — 5 new + 2 revision</h2>
    <div class="sub">Next problems in sequence, plus 2 older ones to redo without looking at your code. Click the counter after each one (＋ → ✓ for new, R1, R2… for revisions).</div>
    <h3>New (${newOnes.filter(p=>isProblemDone(p.n)).length}/5 today)</h3>`;
  h += newOnes.length ? newOnes.map(p => planRow(p, true)).join('') : `<div class="sub">Nothing pending — you finished everything. 🎉</div>`;
  h += `<h3>Revise</h3>`;
  h += revise.length ? revise.map(p => planRow(p, false)).join('') : `<div class="sub">Solve a few problems first — revision picks come from your completed ones.</div>`;
  h += `<div class="plan-note"><b>For every new problem:</b> identify the pattern → brute force → optimized approach → code → time/space complexity.<br>
  Stuck ~20 min? Write what you tried and where it fails before checking the solution.<br>
  After every 5-question set, do 3–5 unseen questions and identify ONLY the pattern first.</div></div>`;
  return h;
}
function togglePlan() {
  planOpen = !planOpen;
  document.getElementById('f-plan').classList.toggle('plan-on', planOpen);
  renderContent();
}

/* ======================= RENDER ======================= */
function buildSidebar() {
  let h = `<div class="sidebar-title">Jump to pattern</div>`;
  h += `<button class="step-btn${activeStep==='all'?' on':''}" onclick="jumpToStep('all')"><span class="step-name">All Patterns</span><span class="step-count">${TOTAL}</span></button>`;
  DATA.forEach(s => {
    h += `<button class="step-btn${activeStep===s.id?' on':''}" onclick="jumpToStep(${s.id})"><span class="step-name">${esc(s.name)}</span><span class="step-count">${doneProbsForStep(s)}/${s.problems.length}</span></button>`;
  });
  document.getElementById('sidebar').innerHTML = h;
}
function jumpToStep(id) {
  activeStep = id;
  buildSidebar();
  renderContent();
}
function setFilter(f) {
  filter = f;
  document.querySelectorAll('.fbtn').forEach(b => { if(b.id !== 'f-plan') b.classList.remove('on','on-done','on-pend','on-star'); });
  const map = { all:['f-all','on'], done:['f-done','on-done'], pending:['f-pend','on-pend'], starred:['f-star','on-star'] };
  document.getElementById(map[f][0]).classList.add(map[f][1]);
  renderContent();
}
function updateStats() {
  const vals = Object.values(state.problems);
  const d = vals.filter(p => p.done).length;
  const starred = vals.filter(p => p.starred).length;
  const pct = TOTAL ? Math.round(d / TOTAL * 100) : 0;
  document.getElementById('s-done').textContent = d;
  document.getElementById('s-rem').textContent = TOTAL - d;
  document.getElementById('s-pct').textContent = pct + '%';
  document.getElementById('s-star').textContent = starred;
  document.getElementById('prog-fill').style.width = pct + '%';
}
function updateDashboard() {
  const activity = getDailyActivity();
  const streak = calculateCurrentStreak(activity);
  const maxStreak = calculateMaxStreak(activity);
  const today = activity[getTodayKey()] || 0;
  const doneCount = Object.values(state.problems).filter(p => p.done).length;
  document.getElementById('s-streak').textContent = streak;
  document.getElementById('s-maxstreak').textContent = maxStreak;
  document.getElementById('dash-streak-num').textContent = streak;
  document.getElementById('dash-today-num').textContent = today;
  document.getElementById('dash-message').textContent = getMotivationMessage(streak, doneCount);
  let sq = '';
  for(let i = 6; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i);
    const c = activity[dateKeyFromDate(d)] || 0;
    const level = c >= 5 ? 3 : c >= 3 ? 2 : c >= 1 ? 1 : 0;
    sq += `<div class="activity-sq${i===0?' today':''}" data-level="${level}" title="${d.toLocaleDateString('en-US',{weekday:'short'})}: ${c} solved"></div>`;
  }
  document.getElementById('activity-squares').innerHTML = sq;
}
function renderContent() {
  const q = document.getElementById('search').value.toLowerCase().trim();
  let html = hintHtml() + (planOpen ? buildPlanHtml() : '');
  let totalVisible = 0;

  DATA.forEach(step => {
    if(activeStep !== 'all' && step.id !== activeStep) return;
    const probs = step.problems.filter(p => {
      const ps = getProblemState(p.n);
      const matchQ = !q || p.t.toLowerCase().includes(q) || String(p.n) === q;
      const matchF = filter === 'all' || (filter === 'done' && ps.done) || (filter === 'pending' && !ps.done) || (filter === 'starred' && ps.starred);
      return matchQ && matchF;
    });
    if(!probs.length) return;
    totalVisible += probs.length;

    const doneC = doneProbsForStep(step);
    const pct = Math.round(doneC / step.problems.length * 100);
    const collapsed = !!state.collapsedSteps[step.id];

    html += `<div class="step-section${collapsed?' collapsed':''}" id="step-${step.id}">
      <div class="step-header" onclick="toggleCollapse(${step.id})">
        <span class="step-num">P${step.id}</span>
        <span class="step-title">${esc(step.name)}</span>
        <span class="step-progress-text">${doneC}/${step.problems.length}</span>
        <div class="step-mini-bar"><div class="step-mini-fill" style="width:${pct}%"></div></div>
        <svg class="step-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
      </div>
      <div class="problems-list">`;

    probs.forEach(p => {
      const ps = getProblemState(p.n);
      const dl = p.diff === 'e' ? 'Easy' : p.diff === 'm' ? 'Med' : 'Hard';
      let links = '';
      if(p.l) links += `<a class="lnk lnk-lc" href="${p.l}" target="_blank" rel="noopener" title="${p.prem?'LeetCode Premium problem':''}">LC ↗${p.prem?'<span class="lock">🔒</span>':''}</a>`;
      if(p.g) links += `<a class="lnk lnk-gfg" href="${p.g}" target="_blank" rel="noopener" title="No LeetCode number in the PDF — opens a search">Search ↗</a>`;
      const dateHtml = dateHtmlFor(ps);
      html += `<div class="prob${ps.done?' done':''}" id="prob-${p.n}">
        ${counterHtml(p.n)}
        <button type="button" class="star-btn${ps.starred?' starred':''}" onclick="toggleStar(${p.n}, event)" title="Mark as Important" aria-label="Star problem ${p.n}">${ps.starred?'★':'☆'}</button>
        <span class="prob-num">${p.n}</span>
        <div class="prob-name"><span class="prob-title">${esc(p.t)}</span>${dateHtml}</div>
        <span class="diff ${p.diff}">${dl}</span>
        <div class="links">${links}</div>
      </div>`;
    });
    html += `</div></div>`;
  });

  if(totalVisible === 0 && !planOpen) {
    let msg = 'No problems found';
    if(filter === 'starred') msg = q ? 'No starred problems match your search.' : 'No starred problems yet. Star the questions you want to revisit.';
    html = `<div class="empty"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg><p>${msg}</p></div>`;
  }
  document.getElementById('content').innerHTML = html;
}
function toggleCollapse(id) {
  const el = document.getElementById('step-' + id);
  el.classList.toggle('collapsed');
  if(el.classList.contains('collapsed')) state.collapsedSteps[id] = true; else delete state.collapsedSteps[id];
  saveState();
}
function refreshAll() { renderContent(); updateStats(); updateDashboard(); buildSidebar(); }
function syncHeaderHeight() {
  document.documentElement.style.setProperty('--hh', document.getElementById('header').offsetHeight + 'px');
}
function init() {
  loadState();
  document.getElementById('header-sub').textContent = `${TOTAL} problems · ${DATA.length} patterns · 5 new + 2 revision daily`;
  refreshAll();
  syncHeaderHeight();
}
document.getElementById('search').addEventListener('input', renderContent);
window.addEventListener('resize', syncHeaderHeight);
init();
</script>
</body>
</html>
