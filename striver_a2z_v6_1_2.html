<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Striver A2Z DSA Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0f;
  --surface: #111118;
  --surface2: #1a1a24;
  --border: #2a2a3a;
  --accent: #6c63ff;
  --accent2: #ff6b6b;
  --accent3: #43e97b;
  --accent4: #f7971e;
  --text: #e8e8f0;
  --text2: #888899;
  --text3: #555566;
  --lc: #ffa116;
  --gfg: #2f8d46;
  --done-bg: rgba(67,233,123,0.06);
  --gold: #fbbf24;
  --streak: #ff8a4c;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Syne', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

/* NOISE OVERLAY */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 0;
}

/* HEADER */
.header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(10,10,15,0.92);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 1rem 1.5rem;
}

.header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: .75rem;
}

.logo {
  display: flex;
  align-items: center;
  gap: .75rem;
}

.logo-icon {
  width: 36px; height: 36px;
  background: var(--accent);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Space Mono', monospace;
  font-size: 14px; font-weight: 700;
  color: #fff;
  flex-shrink: 0;
}

.logo-text h1 {
  font-size: 16px; font-weight: 800;
  letter-spacing: -.3px;
}

.logo-text p {
  font-size: 11px;
  color: var(--text2);
  font-weight: 400;
}

.header-stats {
  display: flex;
  gap: 1rem;
  align-items: center;
}

.stat-pill {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 4px 12px;
  font-size: 12px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.stat-pill .num {
  font-family: 'Space Mono', monospace;
  font-size: 13px;
  font-weight: 700;
}

.stat-pill.done .num { color: var(--accent3); }
.stat-pill.rem .num { color: var(--accent2); }
.stat-pill.pct .num { color: var(--accent); }
.stat-pill.streak .num { color: var(--streak); }
.stat-pill.maxstreak .num { color: var(--gold); }

/* PROGRESS BAR */
.progress-track {
  height: 3px;
  background: var(--border);
  border-radius: 3px;
  overflow: hidden;
  margin-bottom: .75rem;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent3));
  border-radius: 3px;
  transition: width .4s ease;
}

/* DASHBOARD / MOTIVATION CARD */
.dashboard-card {
  display: flex;
  align-items: center;
  gap: 16px;
  background: linear-gradient(135deg, rgba(108,99,255,.08), rgba(255,138,76,.05));
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 9px 14px;
  margin-bottom: .75rem;
  flex-wrap: wrap;
}

.streak-badge {
  display: flex;
  align-items: center;
  gap: 7px;
  flex-shrink: 0;
}
.streak-flame {
  font-size: 19px;
  filter: drop-shadow(0 0 5px rgba(255,138,76,.45));
}
.streak-badge-text {
  display: flex;
  flex-direction: column;
  line-height: 1.15;
}
.streak-badge-text .streak-num {
  font-family: 'Space Mono', monospace;
  font-weight: 700;
  font-size: 17px;
  color: var(--streak);
}
.streak-badge-text .streak-label {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .8px;
  text-transform: uppercase;
  color: var(--text3);
}

.motivation-text {
  flex: 1;
  min-width: 180px;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--text2);
}

.mini-stats {
  display: flex;
  align-items: center;
  gap: 14px;
  flex-shrink: 0;
}

.today-stat {
  font-family: 'Space Mono', monospace;
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: .5px;
  color: var(--text3);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1px;
  text-transform: uppercase;
}
.today-stat .num {
  font-size: 15px;
  color: var(--accent3);
}

.activity-squares {
  display: flex;
  gap: 3px;
  align-items: flex-end;
}
.activity-sq {
  width: 13px;
  height: 13px;
  border-radius: 3px;
  background: var(--border);
  cursor: default;
  transition: transform .15s;
}
.activity-sq:hover { transform: scale(1.2); }
.activity-sq[data-level="1"] { background: rgba(67,233,123,.32); }
.activity-sq[data-level="2"] { background: rgba(67,233,123,.62); }
.activity-sq[data-level="3"] { background: rgba(67,233,123,.95); }
.activity-sq.today { box-shadow: 0 0 0 1.5px var(--accent3); }

/* CONTROLS */
.controls {
  display: flex;
  gap: .5rem;
  flex-wrap: wrap;
  align-items: center;
}

.search-wrap {
  position: relative;
  flex: 1;
  min-width: 200px;
}

.search-wrap svg {
  position: absolute;
  left: 10px; top: 50%;
  transform: translateY(-50%);
  color: var(--text3);
  pointer-events: none;
}

#search {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 10px 8px 34px;
  color: var(--text);
  font-family: 'Syne', sans-serif;
  font-size: 13px;
  outline: none;
  transition: border-color .2s;
}
#search:focus { border-color: var(--accent); }
#search::placeholder { color: var(--text3); }

.filter-group {
  display: flex;
  gap: 4px;
}

.fbtn {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: 7px 12px;
  font-size: 12px;
  font-family: 'Syne', sans-serif;
  font-weight: 600;
  color: var(--text2);
  cursor: pointer;
  transition: all .15s;
  white-space: nowrap;
}
.fbtn:hover { border-color: var(--accent); color: var(--text); }
.fbtn.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.fbtn.on-done { background: var(--accent3); border-color: var(--accent3); color: #000; }
.fbtn.on-pend { background: var(--accent2); border-color: var(--accent2); color: #fff; }

.reset-btn {
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: 7px 12px;
  font-size: 12px;
  font-family: 'Syne', sans-serif;
  font-weight: 600;
  color: var(--text3);
  cursor: pointer;
  transition: all .15s;
}
.reset-btn:hover { border-color: var(--accent2); color: var(--accent2); }

/* LAYOUT */
.main {
  display: flex;
  gap: 0;
  position: relative;
  z-index: 1;
}

/* SIDEBAR */
.sidebar {
  width: 220px;
  flex-shrink: 0;
  position: sticky;
  top: 145px;
  height: calc(100vh - 145px);
  overflow-y: auto;
  border-right: 1px solid var(--border);
  padding: 1rem;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}

.sidebar-title {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--text3);
  margin-bottom: .75rem;
  padding-left: 4px;
}

.step-btn {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  background: transparent;
  border: none;
  border-radius: 7px;
  padding: 7px 8px;
  font-size: 12px;
  font-family: 'Syne', sans-serif;
  font-weight: 600;
  color: var(--text2);
  cursor: pointer;
  transition: all .15s;
  text-align: left;
  margin-bottom: 2px;
}

.step-btn:hover { background: var(--surface2); color: var(--text); }
.step-btn.on { background: var(--surface2); color: var(--accent); border-left: 2px solid var(--accent); padding-left: 6px; }

.step-btn .step-name { flex: 1; }
.step-btn .step-count {
  font-family: 'Space Mono', monospace;
  font-size: 10px;
  color: var(--text3);
  background: var(--border);
  border-radius: 4px;
  padding: 1px 5px;
  flex-shrink: 0;
}
.step-btn.on .step-count { background: rgba(108,99,255,.2); color: var(--accent); }

/* CONTENT */
.content {
  flex: 1;
  min-width: 0;
  padding: 1rem;
}

/* STEP SECTION */
.step-section {
  margin-bottom: 1.5rem;
}

.step-header {
  display: flex;
  align-items: center;
  gap: .75rem;
  margin-bottom: .75rem;
  padding: .75rem 1rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  cursor: pointer;
  transition: border-color .2s;
}
.step-header:hover { border-color: var(--accent); }

.step-num {
  font-family: 'Space Mono', monospace;
  font-size: 11px;
  font-weight: 700;
  color: var(--accent);
  background: rgba(108,99,255,.12);
  border-radius: 5px;
  padding: 3px 7px;
  flex-shrink: 0;
}

.step-title {
  font-size: 14px;
  font-weight: 700;
  flex: 1;
}

.step-progress-text {
  font-family: 'Space Mono', monospace;
  font-size: 11px;
  color: var(--text2);
  flex-shrink: 0;
}

.step-mini-bar {
  width: 60px; height: 3px;
  background: var(--border);
  border-radius: 3px;
  overflow: hidden;
  flex-shrink: 0;
}
.step-mini-fill {
  height: 100%;
  background: var(--accent3);
  border-radius: 3px;
  transition: width .3s;
}

.step-chevron {
  color: var(--text3);
  transition: transform .2s;
  flex-shrink: 0;
}
.step-section.collapsed .step-chevron { transform: rotate(-90deg); }
.step-section.collapsed .problems-list { display: none; }

/* PROBLEM ITEM */
.problems-list {
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.prob {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  transition: all .15s;
  animation: fadeIn .2s ease;
}
.prob:hover { background: var(--surface2); border-color: var(--border); transform: translateX(2px); }
.prob.done { background: var(--done-bg); border-color: rgba(67,233,123,.15); opacity: .7; }

@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

/* CHECKBOX */
.cb-wrap {
  position: relative;
  flex-shrink: 0;
}
.cb-wrap input[type=checkbox] {
  appearance: none;
  width: 18px; height: 18px;
  border: 1.5px solid var(--border);
  border-radius: 5px;
  cursor: pointer;
  background: var(--bg);
  transition: all .15s;
  display: flex; align-items: center; justify-content: center;
}
.cb-wrap input[type=checkbox]:checked {
  background: var(--accent3);
  border-color: var(--accent3);
}
.cb-wrap input[type=checkbox]:checked::after {
  content: '✓';
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  font-size: 11px;
  color: #000;
  font-weight: 700;
}

.prob-num {
  font-family: 'Space Mono', monospace;
  font-size: 10px;
  color: var(--text3);
  min-width: 26px;
  flex-shrink: 0;
}

.prob-name {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 1px;
}

.prob-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  transition: color .15s;
}
.prob.done .prob-title {
  text-decoration: line-through;
  color: var(--text3);
}

.solved-date {
  font-size: 10px;
  font-family: 'Space Mono', monospace;
  font-weight: 400;
  color: var(--text3);
  cursor: default;
}
.solved-date:hover { color: var(--accent3); }

.links {
  display: flex;
  gap: 5px;
  flex-shrink: 0;
}

.lnk {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 9px;
  border-radius: 5px;
  font-size: 11px;
  font-weight: 700;
  font-family: 'Space Mono', monospace;
  text-decoration: none;
  transition: all .15s;
  white-space: nowrap;
  cursor: pointer;
}
.lnk:hover { transform: translateY(-1px); }

.lnk-lc {
  background: rgba(255,161,22,.12);
  border: 1px solid rgba(255,161,22,.25);
  color: var(--lc);
}
.lnk-lc:hover { background: rgba(255,161,22,.22); }

.lnk-gfg {
  background: rgba(47,141,70,.12);
  border: 1px solid rgba(47,141,70,.25);
  color: var(--gfg);
}
.lnk-gfg:hover { background: rgba(47,141,70,.22); }

.lnk-yt {
  background: rgba(255,60,60,.12);
  border: 1px solid rgba(255,60,60,.28);
  color: #ff5252;
}
.lnk-yt:hover { background: rgba(255,60,60,.24); }

.lnk-doc {
  background: rgba(56,189,248,.12);
  border: 1px solid rgba(56,189,248,.28);
  color: #38bdf8;
}
.lnk-doc:hover { background: rgba(56,189,248,.24); }
/* ─── Star button ─── */
.star-btn {
  flex-shrink:0; background:none; border:none; cursor:pointer;
  font-size:17px; color:#2d2d45; padding:0 3px;
  transition:color .18s,transform .15s; line-height:1;
}
.star-btn:hover { color:#fbbf24; transform:scale(1.25); }
.star-btn.s-on  { color:#fbbf24; filter:drop-shadow(0 0 4px #fbbf2488); }
.starred-row    { background:rgba(251,191,36,.045) !important; }
.starred-row .prob-title { color:#fde68a !important; }

/* ─── Note button ─── */
.note-btn {
  flex-shrink:0; background:none; border:none; cursor:pointer;
  font-size:15px; color:#2d2d45; padding:0 3px; position:relative;
  transition:color .18s; line-height:1;
}
.note-btn:hover { color:#a78bfa; }
.note-btn.n-on  { color:#a78bfa; }
.note-btn.n-on::after {
  content:''; position:absolute; top:0; right:0;
  width:5px; height:5px; background:#a78bfa; border-radius:50%;
}

/* ─── Note panel ─── */
.note-panel {
  max-height:0; overflow:hidden;
  transition:max-height .28s ease, padding .28s ease;
  background:#0b0f1e; border-left:2px solid #a78bfa33;
  margin-left:28px; border-radius:0 0 6px 0;
}
.note-panel.open { max-height:260px; padding:10px 14px 12px; }
.note-panel textarea {
  width:100%; min-height:90px; background:#141929;
  border:1px solid #2d3452; border-radius:6px;
  color:#c9d1d9; font-size:13px; font-family:inherit;
  padding:8px 10px; resize:vertical; outline:none;
  box-sizing:border-box; line-height:1.5;
}
.note-panel textarea:focus { border-color:#a78bfa; }
.note-foot { display:flex; align-items:center; gap:8px; margin-top:8px; }
.note-hint  { font-size:11px; color:#374151; flex:1; }
.n-save {
  background:rgba(167,139,250,.15); border:1px solid rgba(167,139,250,.3);
  color:#a78bfa; border-radius:5px; padding:3px 12px;
  font-size:12px; cursor:pointer; font-family:inherit;
}
.n-save:hover { background:rgba(167,139,250,.28); }
.n-cls {
  background:rgba(107,114,128,.1); border:1px solid rgba(107,114,128,.2);
  color:#6b7280; border-radius:5px; padding:3px 8px;
  font-size:12px; cursor:pointer; font-family:inherit;
}
.n-cls:hover { color:#9ca3af; }

/* ─── Starred filter btn ─── */
.fbtn.on-star { background:rgba(251,191,36,.15); border-color:rgba(251,191,36,.4); color:#fbbf24; }


.lnk-theory {
  background: rgba(108,99,255,.12);
  border: 1px solid rgba(108,99,255,.2);
  color: var(--accent);
  font-size: 10px;
}

/* DIFFICULTY */
.diff {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .5px;
  padding: 2px 6px;
  border-radius: 4px;
  flex-shrink: 0;
}
.diff.e { background: rgba(67,233,123,.1); color: var(--accent3); }
.diff.m { background: rgba(255,161,22,.1); color: var(--lc); }
.diff.h { background: rgba(255,107,107,.1); color: var(--accent2); }

/* EMPTY */
.empty {
  text-align: center;
  padding: 3rem 1rem;
  color: var(--text3);
}
.empty svg { margin-bottom: 1rem; opacity: .3; }
.empty p { font-size: 14px; }

/* TOAST */
.toast {
  position: fixed;
  bottom: 1.5rem;
  right: 1.5rem;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 16px;
  font-size: 13px;
  font-weight: 600;
  z-index: 999;
  transform: translateY(100px);
  opacity: 0;
  transition: all .3s ease;
  display: flex;
  align-items: center;
  gap: 8px;
}
.toast.show { transform: translateY(0); opacity: 1; }
.toast.green { border-color: rgba(67,233,123,.3); color: var(--accent3); }
.toast.red { border-color: rgba(255,107,107,.3); color: var(--accent2); }

/* SCROLLBAR */
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* MOBILE */
@media (max-width: 768px) {
  .sidebar { display: none; }
  .header-top { flex-wrap: wrap; gap: .5rem; }
  .header-stats {
    display: flex;
    flex-wrap: wrap;
    width: 100%;
    gap: 6px;
    margin-top: .25rem;
  }
  .dashboard-card {
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
    padding: 10px 12px;
  }
  .motivation-text { font-size: 11.5px; }
  .mini-stats { width: 100%; justify-content: space-between; }
  .solved-date { font-size: 9.5px; }
  .prob-title { font-size: 12.5px; }
}
</style>
</head>
<body>

<header class="header">
  <div class="header-top">
    <div class="logo">
      <div class="logo-icon">A2Z</div>
      <div class="logo-text">
        <h1>Striver A2Z DSA Tracker</h1>
        <p>455 problems · takeuforward.org · placement ready</p>
      </div>
    </div>
    <div class="header-stats">
      <div class="stat-pill done">✓ <span class="num" id="s-done">0</span> done</div>
      <div class="stat-pill rem">◎ <span class="num" id="s-rem">455</span> left</div>
      <div class="stat-pill streak">🔥 <span class="num" id="s-streak">0</span></div>
      <div class="stat-pill maxstreak">🏆 <span class="num" id="s-maxstreak">0</span></div>
      <div class="stat-pill pct">⚡ <span class="num" id="s-pct">0%</span></div>
    </div>
  </div>
  <div style="text-align:right;padding:2px 6px 0;font-size:11px;color:#4b5563;" id="last-saved-txt"></div>
  <div class="progress-track">
    <div class="progress-fill" id="prog-fill" style="width:0%"></div>
  </div>
  <div class="dashboard-card" id="dashboard-card">
    <div class="streak-badge">
      <span class="streak-flame">🔥</span>
      <div class="streak-badge-text">
        <span class="streak-num" id="dash-streak-num">0</span>
        <span class="streak-label">day streak</span>
      </div>
    </div>
    <div class="motivation-text" id="dash-message">🚀 Start with just ONE problem today. Consistency beats intensity.</div>
    <div class="mini-stats">
      <div class="today-stat">Today<span class="num" id="dash-today-num">0</span></div>
      <div class="activity-squares" id="activity-squares"></div>
    </div>
  </div>
  <div class="controls">
    <div class="search-wrap">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="search" placeholder="Search problems by name or number...">
    </div>
    <div class="filter-group">
      <button class="fbtn on" id="f-all" onclick="setFilter('all')">All</button>

    const cd = localStorage.getItem('a2z_dates');       if(cd) completionDates = JSON.parse(cd);
    const ms = localStorage.getItem('a2z_maxstreak');   if(ms) maxStreak = parseInt(ms, 10) || 0;
    const ts = localStorage.getItem('a2z_v2_ts');       if(ts) updateLastSaved(Number(ts));
  } catch(e) {}
  buildSidebar();
  renderContent();
  updateStats();
  updateDashboard();
}

function save() {
  try {
    const ts = Date.now();
    localStorage.setItem('a2z_v2',        JSON.stringify(done));
    localStorage.setItem('a2z_starred',   JSON.stringify(starred));
    localStorage.setItem('a2z_notes',     JSON.stringify(notes));
    localStorage.setItem('a2z_dates',     JSON.stringify(completionDates));
    localStorage.setItem('a2z_v2_ts', ts);
    showSaveBadge();
    updateLastSaved(ts);
  } catch(e) {}
}

// Separate lightweight persist for maxStreak so recalculating it on every
// render doesn't spam the "Progress auto-saved" badge like save() does.
function persistMaxStreak() {
  try { localStorage.setItem('a2z_maxstreak', String(maxStreak)); } catch(e) {}
}

function showSaveBadge() {
  const b = document.getElementById('save-badge');
  b.style.opacity = '1';
  clearTimeout(window._saveTimer);
  window._saveTimer = setTimeout(() => b.style.opacity = '0', 2200);
}

function updateLastSaved(ts) {
  if(!ts) return;
  const el = document.getElementById('last-saved-txt');
  if(!el) return;
  const d = new Date(ts);
  const pad = n => String(n).padStart(2,'0');
  el.textContent = '💾 Last saved: '
    + d.getDate()+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()
    + '  '+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());
}

function exportProgress() {
  const total = Object.values(done).filter(Boolean).length;
  const payload = {
    version: 'a2z_v2',
    exported: new Date().toISOString(),
    solved: total,
    data: done,
    starred: starred,
    notes: notes,
    completionDates: completionDates,
    maxStreak: maxStreak
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  const dateStr = new Date().toISOString().slice(0,10);
  a.download = 'striver_a2z_progress_'+dateStr+'.json';
  a.click();
  URL.revokeObjectURL(a.href);
  showToast('✅ Backup exported — '+total+' problems saved!', 'green');
}

function importProgress(e) {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const obj = JSON.parse(ev.target.result);
      const imported = obj.data || obj;
      if(typeof imported !== 'object') throw new Error();
      done = imported;
      if(obj.starred)         starred = obj.starred;
      if(obj.notes)            notes   = obj.notes;
      if(obj.completionDates)  completionDates = obj.completionDates;
      if(typeof obj.maxStreak === 'number') maxStreak = obj.maxStreak;
      save();
      persistMaxStreak();
      renderContent();
      updateStats();
      updateDashboard();
      buildSidebar();
      const cnt = Object.values(done).filter(Boolean).length;
      showToast('✅ Imported! '+cnt+' problems restored.', 'green');
    } catch(err) {
      showToast('❌ Invalid backup file', 'red');
    }
  };
  reader.readAsText(file);
  e.target.value = '';          // allow re-importing same file
}

function totalProbs() {
  let t = 0;
  DATA.forEach(s => t += s.problems.length);
  return t;
}

function doneProbsForStep(step) {
  return step.problems.filter(p => done[p.n]).length;
}

function buildSidebar() {
  const sb = document.getElementById('sidebar');
  let h = `<div class="sidebar-title">Jump to step</div>`;
  h += `<button class="step-btn on" onclick="jumpToStep('all',this)"><span class="step-name">All Steps</span><span class="step-count">455</span></button>`;
  DATA.forEach((s, i) => {
    const cnt = s.problems.length;
    const doneC = doneProbsForStep(s);
    h += `<button class="step-btn" onclick="jumpToStep(${s.id},this)"><span class="step-name">S${s.id}: ${s.name.split(':')[1]?.trim().substring(0,12)||''}</span><span class="step-count">${doneC}/${cnt}</span></button>`;
  });
  sb.innerHTML = h;
}

function jumpToStep(id, el) {
  document.querySelectorAll('.step-btn').forEach(b => b.classList.remove('on'));
  el.classList.add('on');
  activeStep = id === 'all' ? 'all' : id;
  renderContent();
}

function setFilter(f) {
  filter = f;
  document.querySelectorAll('.fbtn').forEach(b => b.classList.remove('on','on-done','on-pend','on-star'));
  const _fmap = {all:'f-all',done:'f-done',pending:'f-pend',starred:'f-star'};
  const el = document.getElementById(_fmap[f] || 'f-all');
  if(f==='all') el.classList.add('on');
  else if(f==='done') el.classList.add('on-done');
  else if(f==='starred') el.classList.add('on-star');
  else el.classList.add('on-pend');
  renderContent();
}

function updateStats() {
  const total = totalProbs();
  const d = Object.values(done).filter(Boolean).length;
  const pct = Math.round((d/total)*100);
  document.getElementById('s-done').textContent = d;
  document.getElementById('s-rem').textContent = total - d;
  document.getElementById('s-pct').textContent = pct + '%';
  document.getElementById('prog-fill').style.width = pct + '%';
}

/* ======================================================================
   STREAK / DATE HELPERS
   ====================================================================== */

function getTodayKey() { return dateKeyFromDate(new Date()); }

function dateKeyFromDate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function formatDate(dateKey) {
  if(!dateKey) return '';
  const [y, m, d] = dateKey.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${months[dt.getMonth()]} ${dt.getDate()}, ${dt.getFullYear()}`;
}

// Derived purely from CURRENTLY done problems' completedOn dates —
// unchecking a problem removes its date's contribution automatically.
function getDailyActivity() {
  const map = {};
  Object.keys(completionDates).forEach(n => {
    const cd = completionDates[n];
    if(done[n] && cd && cd.completedOn) {
      map[cd.completedOn] = (map[cd.completedOn] || 0) + 1;
    }
  });
  return map;
}

function calculateCurrentStreak(activity) {
  activity = activity || getDailyActivity();
  let streak = 0;
  let d = new Date();
  while(true) {
    const key = dateKeyFromDate(d);
    if(activity[key] > 0) {
      streak++;
      d.setDate(d.getDate() - 1);
    } else {
      break;
    }
  }
  return streak;
}

// Longest run ever recorded — persisted so it never drops if a past
// completion is later unchecked. "Highest ever achieved" is permanent.
function calculateMaxStreak(activity) {
  activity = activity || getDailyActivity();
  const keys = Object.keys(activity).filter(k => activity[k] > 0).sort();

  let longestInCurrentData = 0, run = 0, prevDate = null;
  keys.forEach(k => {
    const [y, m, d] = k.split('-').map(Number);
    const cur = new Date(y, m - 1, d);
    if(prevDate) {
      const diffDays = Math.round((cur - prevDate) / 86400000);
      run = diffDays === 1 ? run + 1 : 1;
    } else {
      run = 1;
    }
    longestInCurrentData = Math.max(longestInCurrentData, run);
    prevDate = cur;
  });

  const currentStreak = calculateCurrentStreak(activity);
  const best = Math.max(longestInCurrentData, currentStreak, maxStreak || 0);
  if(best > (maxStreak || 0)) {
    maxStreak = best;
    persistMaxStreak();
  }
  return maxStreak || 0;
}

function getTodaySolvedCount(activity) {
  activity = activity || getDailyActivity();
  return activity[getTodayKey()] || 0;
}

function getMotivationMessage(currentStreak, doneCount, total) {
  if(total > 0 && doneCount === total) return `🏆 ${total}/${total} — You finished the tracker. Now revise the starred problems.`;
  if(doneCount === 0) return `🚀 Start with just ONE problem today. Consistency beats intensity.`;
  if(currentStreak === 0) return `🔄 Yesterday was history. Start again today with one problem.`;
  if(currentStreak <= 2) return `🔥 You're building the habit. Don't break the chain.`;
  if(currentStreak <= 6) return `💪 Discipline is forming. Keep showing up.`;
  if(currentStreak <= 13) return `⚡ One week strong. Your consistency is becoming a skill.`;
  if(currentStreak <= 29) return `🏆 Two weeks+ of discipline. Keep pushing.`;
  return `👑 30+ day streak. This is serious consistency.`;
}

function updateDashboard() {
  const activity = getDailyActivity();
  const currentStreak = calculateCurrentStreak(activity);
  const maxS = calculateMaxStreak(activity);
  const today = getTodaySolvedCount(activity);
  const doneCount = Object.values(done).filter(Boolean).length;
  const total = totalProbs();

  const elStreak = document.getElementById('s-streak');
  if(elStreak) elStreak.textContent = currentStreak;
  const elMax = document.getElementById('s-maxstreak');
  if(elMax) elMax.textContent = maxS;
  const elDashStreak = document.getElementById('dash-streak-num');
  if(elDashStreak) elDashStreak.textContent = currentStreak;
  const elToday = document.getElementById('dash-today-num');
  if(elToday) elToday.textContent = today;
  const elMsg = document.getElementById('dash-message');
  if(elMsg) elMsg.textContent = getMotivationMessage(currentStreak, doneCount, total);

  const sqWrap = document.getElementById('activity-squares');
  if(sqWrap) {
    let sqHtml = '';
    for(let i = 6; i >= 0; i--) {
      const d = new Date();
      d.setDate(d.getDate() - i);
      const key = dateKeyFromDate(d);
      const count = activity[key] || 0;
      let level = 0;
      if(count >= 1) level = 1;
      if(count >= 3) level = 2;
      if(count >= 5) level = 3;
      const dayLabel = d.toLocaleDateString('en-US', { weekday: 'short' });
      const isToday = i === 0;
      sqHtml += `<div class="activity-sq${isToday?' today':''}" data-level="${level}" title="${dayLabel}: ${count} solved"></div>`;
    }
    sqWrap.innerHTML = sqHtml;
  }
}

function setCompany(val) {
  coFilter = val;
  renderContent();
}

function renderContent() {
  const q = document.getElementById('search').value.toLowerCase().trim();
  const content = document.getElementById('content');
  let html = '';
  let totalVisible = 0;

  DATA.forEach(step => {
    if(activeStep !== 'all' && step.id !== activeStep) return;

    let probs = step.problems.filter(p => {
      const matchQ = !q || p.t.toLowerCase().includes(q) || String(p.n).includes(q);
      const matchF = filter === 'all' || (filter === 'done' && done[p.n]) || (filter === 'pending' && !done[p.n]) || (filter === 'starred' && starred[p.n]);
      const matchC = coFilter === 'all' || (p.c && p.c.includes(coFilter));
      return matchQ && matchF && matchC;
    });

    if(probs.length === 0) return;
    totalVisible += probs.length;

    const doneC = doneProbsForStep(step);
    const pct = Math.round((doneC / step.problems.length)*100);

    html += `<div class="step-section" id="step-${step.id}">
      <div class="step-header" onclick="toggleCollapse(${step.id})">
        <span class="step-num">S${step.id}</span>
        <span class="step-title">${step.name}</span>
        <span class="step-progress-text">${doneC}/${step.problems.length}</span>
        <div class="step-mini-bar"><div class="step-mini-fill" style="width:${pct}%"></div></div>
        <svg class="step-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
      </div>
      <div class="problems-list">`;

    probs.forEach(p => {
      const isDone = done[p.n];
      const diffClass = p.diff === 'e' ? 'e' : p.diff === 'm' ? 'm' : 'h';
      const diffLabel = p.diff === 'e' ? 'Easy' : p.diff === 'm' ? 'Med' : 'Hard';

      let links = '';
      if(p.l) links += `<a class="lnk lnk-lc" href="${p.l}" target="_blank">LC ↗</a>`;
      if(p.g) links += `<a class="lnk lnk-gfg" href="${p.g}" target="_blank">GFG ↗</a>`;
      if(p.v) links += `<a class="lnk lnk-yt" href="${p.v}" target="_blank">▶ YT</a>`;
      if(p.d) links += `<a class="lnk lnk-doc" href="${p.d}" target="_blank">📖 Docs</a>`;

      const isStarred = !!starred[p.n];
      const hasNote   = !!(notes[p.n] && notes[p.n].trim());
      const cd = completionDates[p.n];
      const dateHtml = (isDone && cd && cd.firstSolvedDate)
        ? `<span class="solved-date" title="First solved ${formatDate(cd.firstSolvedDate)}">Solved ${formatDate(cd.firstSolvedDate)}</span>`
        : '';
      html += `<div class="prob${isDone?' done':''}${isStarred?' starred-row':''}" id="prob-${p.n}">
        <div class="cb-wrap"><input type="checkbox" ${isDone?'checked':''} onchange="toggle(${p.n},this)"></div>
        <span class="prob-num">${p.n}</span>
        <div class="prob-name">
          <span class="prob-title">${p.t}</span>
          ${dateHtml}
        </div>
        <span class="diff ${diffClass}">${diffLabel}</span>
        <div class="links">${links}</div>
        <button class="star-btn${isStarred?' s-on':''}" onclick="toggleStar(${p.n})" title="${isStarred?'Unstar':'Star this problem'}">★</button>
        <button class="note-btn${hasNote?' n-on':''}" onclick="toggleNote(${p.n})" title="${hasNote?'Edit note':'Add note'}">✎</button>
      </div>
      <div class="note-panel" id="np-${p.n}">
        <textarea id="nta-${p.n}" placeholder="Write your approach, intuition, or hints here...\n(Ctrl+Enter to save)" onkeydown="noteKey(event,${p.n})">${(notes[p.n]||'').replace(/`/g,'\\`')}</textarea>
        <div class="note-foot">
          <span class="note-hint">Ctrl+Enter to save</span>
          <button class="n-save" onclick="saveNote(${p.n})">💾 Save</button>
          <button class="n-cls"  onclick="toggleNote(${p.n})">✕</button>
        </div>
      </div>`;
    });

    html += `</div></div>`;
  });

  if(totalVisible === 0) {
    html = `<div class="empty"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg><p>No problems found</p></div>`;
  }

  content.innerHTML = html;
}

function toggleCollapse(id) {
  const el = document.getElementById('step-'+id);
  el.classList.toggle('collapsed');
}

function toggle(n, cb) {
  done[n] = cb.checked;
  const row = document.getElementById('prob-'+n);
  if(cb.checked) {
    row.classList.add('done');
    showToast('✓ Problem #'+n+' marked done!', 'green');
    if(!completionDates[n]) completionDates[n] = { firstSolvedDate: null, completedOn: null };
    const today = getTodayKey();
    if(!completionDates[n].firstSolvedDate) completionDates[n].firstSolvedDate = today; // never overwrite original
    completionDates[n].completedOn = today;
  } else {
    row.classList.remove('done');
    showToast('◎ Problem #'+n+' unmarked', 'red');
    if(completionDates[n]) completionDates[n].completedOn = null; // firstSolvedDate stays preserved
  }

  // Update just this row's subtle date text, without a full re-render.
  const nameEl = row.querySelector('.prob-name');
  if(nameEl) {
    const cd = completionDates[n];
    const showDate = done[n] && cd && cd.firstSolvedDate;
    let dateSpan = nameEl.querySelector('.solved-date');
    if(showDate) {
      if(!dateSpan) {
        dateSpan = document.createElement('span');
        dateSpan.className = 'solved-date';
        nameEl.appendChild(dateSpan);
      }
      dateSpan.textContent = 'Solved ' + formatDate(cd.firstSolvedDate);
      dateSpan.title = 'First solved ' + formatDate(cd.firstSolvedDate);
    } else if(dateSpan) {
      dateSpan.remove();
    }
  }

  save();
  updateStats();
  updateDashboard();
  buildSidebar();
}


function toggleStar(n) {
  starred[n] = !starred[n];
  const row = document.getElementById('prob-'+n);
  const btn = row ? row.querySelector('.star-btn') : null;
  if(starred[n]) {
    row && row.classList.add('starred-row');
    btn && btn.classList.add('s-on');
    showToast('⭐ Starred!', 'green');
  } else {
    row && row.classList.remove('starred-row');
    btn && btn.classList.remove('s-on');
    showToast('☆ Unstarred', 'red');
  }
  save();
  if(filter === 'starred') { renderContent(); updateStats(); buildSidebar(); }
}

function toggleNote(n) {
  const panel = document.getElementById('np-'+n);
  if(!panel) return;
  const opening = !panel.classList.contains('open');
  panel.classList.toggle('open');
  if(opening) {
    const ta = document.getElementById('nta-'+n);
    if(ta) setTimeout(() => { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }, 60);
  }
}

function noteKey(e, n) {
  if(e.ctrlKey && e.key === 'Enter') { e.preventDefault(); saveNote(n); }
}

function saveNote(n) {
  const ta = document.getElementById('nta-'+n);
  if(!ta) return;
  notes[n] = ta.value;
  save();
  const row  = document.getElementById('prob-'+n);
  const btn  = row ? row.querySelector('.note-btn') : null;
  const panel = document.getElementById('np-'+n);
  const hasTxt = ta.value.trim().length > 0;
  if(btn) hasTxt ? btn.classList.add('n-on') : btn.classList.remove('n-on');
  if(panel) panel.classList.remove('open');
  showToast(hasTxt ? '📝 Note saved!' : '🗑️ Note cleared', hasTxt ? 'green' : 'red');
}

let toastTimer;
function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}

function resetAll() {
  if(!confirm('Reset all progress, stars, notes, dates and streak history? This cannot be undone.')) return;
  done = {};
  starred = {};
  notes = {};
  completionDates = {};
  maxStreak = 0;
  save();
  persistMaxStreak();
  renderContent();
  updateStats();
  updateDashboard();
  buildSidebar();
  showToast('Progress reset', 'red');
}

document.getElementById('search').addEventListener('input', renderContent);

load();
</script>
</body>
