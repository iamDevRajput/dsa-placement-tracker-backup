<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DSA Patterns Cheat Sheet Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0f;
  --surface: #111118;
  --surface2: #1a1a24;
  --border: #2a2a3a;
  --accent: #6c63ff;
  --accent2: #ff6b6b;
  --accent3: #43e97b;
  --accent4: #f7971e;
  --text: #e8e8f0;
  --text2: #888899;
  --text3: #555566;
  --lc: #ffa116;
  --gfg: #2f8d46;
  --done-bg: rgba(67,233,123,0.06);
  --gold: #ffd54a;
  --streak: #ff8a4c;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Syne', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

/* NOISE OVERLAY */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 0;
}

/* HEADER */
.header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(10,10,15,0.92);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 1rem 1.5rem;
}

.header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: .75rem;
}

.logo {
  display: flex;
  align-items: center;
  gap: .75rem;
}

.logo-icon {
  width: 36px; height: 36px;
  background: var(--accent);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Space Mono', monospace;
  font-size: 13px; font-weight: 700;
  color: #fff;
  flex-shrink: 0;
}

.logo-text h1 {
  font-size: 16px; font-weight: 800;
  letter-spacing: -.3px;
}

.logo-text p {
  font-size: 11px;
  color: var(--text2);
  font-weight: 400;
}

.header-stats {
  display: flex;
  gap: 1rem;
  align-items: center;
}

.stat-pill {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 4px 12px;
  font-size: 12px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.stat-pill .num {
  font-family: 'Space Mono', monospace;
  font-size: 13px;
  font-weight: 700;
}

.stat-pill.done .num { color: var(--accent3); }
.stat-pill.rem .num { color: var(--accent2); }
.stat-pill.pct .num { color: var(--accent); }
.stat-pill.streak .num { color: var(--streak); }
.stat-pill.maxstreak .num { color: var(--gold); }
.stat-pill.star .num { color: var(--gold); }

/* PROGRESS BAR */
.progress-track {
  height: 3px;
  background: var(--border);
  border-radius: 3px;
  overflow: hidden;
  margin-bottom: .75rem;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent3));
  border-radius: 3px;
  transition: width .4s ease;
}

/* DASHBOARD / MOTIVATION CARD */
.dashboard-card {
  display: flex;
  align-items: center;
  gap: 16px;
  background: linear-gradient(135deg, rgba(108,99,255,.08), rgba(255,138,76,.05));
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 9px 14px;
  margin-bottom: .75rem;
  flex-wrap: wrap;
}

.streak-badge {
  display: flex;
  align-items: center;
  gap: 7px;
  flex-shrink: 0;
}
.streak-flame {
  font-size: 19px;
  filter: drop-shadow(0 0 5px rgba(255,138,76,.45));
}
.streak-badge-text {
  display: flex;
  flex-direction: column;
  line-height: 1.15;
}
.streak-badge-text .streak-num {
  font-family: 'Space Mono', monospace;
  font-weight: 700;
  font-size: 17px;
  color: var(--streak);
}
.streak-badge-text .streak-label {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .8px;
  text-transform: uppercase;
  color: var(--text3);
}

.motivation-text {
  flex: 1;
  min-width: 180px;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--text2);
}

.mini-stats {
  display: flex;
  align-items: center;
  gap: 14px;
  flex-shrink: 0;
}

.today-stat {
  font-family: 'Space Mono', monospace;
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: .5px;
  color: var(--text3);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1px;
  text-transform: uppercase;
}
.today-stat .num {
  font-size: 15px;
  color: var(--accent3);
}

.activity-squares {
  display: flex;
  gap: 3px;
  align-items: flex-end;
}
.activity-sq {
  width: 13px;
  height: 13px;
  border-radius: 3px;
  background: var(--border);
  cursor: default;
  transition: transform .15s;
}
.activity-sq:hover { transform: scale(1.2); }
.activity-sq[data-level="1"] { background: rgba(67,233,123,.32); }
.activity-sq[data-level="2"] { background: rgba(67,233,123,.62); }
.activity-sq[data-level="3"] { background: rgba(67,233,123,.95); }
.activity-sq.today { box-shadow: 0 0 0 1.5px var(--accent3); }

/* CONTROLS */
.controls {
  display: flex;
  gap: .5rem;
  flex-wrap: wrap;
  align-items: center;
}

.search-wrap {
  position: relative;
  flex: 1;
  min-width: 200px;
}

.search-wrap svg {
  position: absolute;
  left: 10px; top: 50%;
  transform: translateY(-50%);
  color: var(--text3);
  pointer-events: none;
}

#search {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 10px 8px 34px;
  color: var(--text);
  font-family: 'Syne', sans-serif;
  font-size: 13px;
  outline: none;
  transition: border-color .2s;
}
#search:focus { border-color: var(--accent); }
#search::placeholder { color: var(--text3); }

.filter-group {
  display: flex;
  gap: 4px;
}

.fbtn {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: 7px 12px;
  font-size: 12px;
  font-family: 'Syne', sans-serif;
  font-weight: 600;
  color: var(--text2);
  cursor: pointer;
  transition: all .15s;
  white-space: nowrap;
}
.fbtn:hover { border-color: var(--accent); color: var(--text); }
.fbtn.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.fbtn.on-done { background: var(--accent3); border-color: var(--accent3); color: #000; }
.fbtn.on-pend { background: var(--accent2); border-color: var(--accent2); color: #fff; }
.fbtn.on-star { background: linear-gradient(135deg, var(--gold), #f7971e); border-color: var(--gold); color: #1a1206; }

.reset-btn {
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: 7px 12px;
  font-size: 12px;
  font-family: 'Syne', sans-serif;
  font-weight: 600;
  color: var(--text3);
  cursor: pointer;
  transition: all .15s;
}
.reset-btn:hover { border-color: var(--accent2); color: var(--accent2); }

/* LAYOUT */
.main {
  display: flex;
  gap: 0;
  position: relative;
  z-index: 1;
}

/* SIDEBAR */
.sidebar {
  width: 240px;
  flex-shrink: 0;
  position: sticky;
  top: 145px;
  height: calc(100vh - 145px);
  overflow-y: auto;
  border-right: 1px solid var(--border);
  padding: 1rem;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}

.sidebar-title {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--text3);
  margin-bottom: .75rem;
  padding-left: 4px;
}

.step-btn {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  background: transparent;
  border: none;
  border-radius: 7px;
  padding: 7px 8px;
  font-size: 12px;
  font-family: 'Syne', sans-serif;
  font-weight: 600;
  color: var(--text2);
  cursor: pointer;
  transition: all .15s;
  text-align: left;
  margin-bottom: 2px;
}

.step-btn:hover { background: var(--surface2); color: var(--text); }
.step-btn.on { background: var(--surface2); color: var(--accent); border-left: 2px solid var(--accent); padding-left: 6px; }

.step-btn .step-name { flex: 1; }
.step-btn .step-count {
  font-family: 'Space Mono', monospace;
  font-size: 10px;
  color: var(--text3);
  background: var(--border);
  border-radius: 4px;
  padding: 1px 5px;
  flex-shrink: 0;
}
.step-btn.on .step-count { background: rgba(108,99,255,.2); color: var(--accent); }

/* CONTENT */
.content {
  flex: 1;
  min-width: 0;
  padding: 1rem;
}

/* STEP SECTION */
.step-section {
  margin-bottom: 1.5rem;
}

.step-header {
  display: flex;
  align-items: center;
  gap: .75rem;
  margin-bottom: .75rem;
  padding: .75rem 1rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  cursor: pointer;
  transition: border-color .2s;
}
.step-header:hover { border-color: var(--accent); }

.step-num {
  font-family: 'Space Mono', monospace;
  font-size: 11px;
  font-weight: 700;
  color: var(--accent);
  background: rgba(108,99,255,.12);
  border-radius: 5px;
  padding: 3px 7px;
  flex-shrink: 0;
}

.step-title {
  font-size: 14px;
  font-weight: 700;
  flex: 1;
}

.step-progress-text {
  font-family: 'Space Mono', monospace;
  font-size: 11px;
  color: var(--text2);
  flex-shrink: 0;
}

.step-mini-bar {
  width: 60px; height: 3px;
  background: var(--border);
  border-radius: 3px;
  overflow: hidden;
  flex-shrink: 0;
}
.step-mini-fill {
  height: 100%;
  background: var(--accent3);
  border-radius: 3px;
  transition: width .3s;
}

.step-chevron {
  color: var(--text3);
  transition: transform .2s;
  flex-shrink: 0;
}
.step-section.collapsed .step-chevron { transform: rotate(-90deg); }
.step-section.collapsed .problems-list { display: none; }

/* PROBLEM ITEM */
.problems-list {
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.prob {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  transition: all .15s;
  animation: fadeIn .2s ease;
}
.prob:hover { background: var(--surface2); border-color: var(--border); transform: translateX(2px); }
.prob.done { background: var(--done-bg); border-color: rgba(67,233,123,.15); opacity: .7; }

@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

/* CHECKBOX */
.cb-wrap {
  position: relative;
  flex-shrink: 0;
}
.cb-wrap input[type=checkbox] {
  appearance: none;
  width: 18px; height: 18px;
  border: 1.5px solid var(--border);
  border-radius: 5px;
  cursor: pointer;
  background: var(--bg);
  transition: all .15s;
  display: flex; align-items: center; justify-content: center;
}
.cb-wrap input[type=checkbox]:checked {
  background: var(--accent3);
  border-color: var(--accent3);
}
.cb-wrap input[type=checkbox]:checked::after {
  content: '✓';
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  font-size: 11px;
  color: #000;
  font-weight: 700;
}

.prob-num {
  font-family: 'Space Mono', monospace;
  font-size: 10px;
  color: var(--text3);
  min-width: 26px;
  flex-shrink: 0;
}

.prob-name {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 1px;
}

.prob-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  transition: color .15s;
}
.prob.done .prob-title {
  text-decoration: line-through;
  color: var(--text3);
}

.solved-date {
  font-size: 10px;
  font-family: 'Space Mono', monospace;
  font-weight: 400;
  color: var(--text3);
  cursor: default;
}
.solved-date:hover { color: var(--accent3); }

/* STAR BUTTON */
.star-btn {
  width: 24px;
  height: 24px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: none;
  border-radius: 6px;
  font-size: 15px;
  line-height: 1;
  color: var(--text3);
  cursor: pointer;
  transition: all .15s;
}
.star-btn:hover { background: var(--surface2); color: var(--gold); }
.star-btn.starred {
  color: var(--gold);
  text-shadow: 0 0 8px rgba(255,213,74,.55);
  animation: starPop .3s ease;
}
@keyframes starPop {
  0% { transform: scale(1); }
  45% { transform: scale(1.35); }
  100% { transform: scale(1); }
}

.links {
  display: flex;
  gap: 5px;
  flex-shrink: 0;
}

.lnk {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 9px;
  border-radius: 5px;
  font-size: 11px;
  font-weight: 700;
  font-family: 'Space Mono', monospace;
  text-decoration: none;
  transition: all .15s;
  white-space: nowrap;
  cursor: pointer;
}
.lnk:hover { transform: translateY(-1px); }

.lnk-lc {
  background: rgba(255,161,22,.12);
  border: 1px solid rgba(255,161,22,.25);
  color: var(--lc);
}
.lnk-lc:hover { background: rgba(255,161,22,.2); }

.lnk-gfg {
  background: rgba(47,141,70,.15);
  border: 1px solid rgba(47,141,70,.3);
  color: #4caf6e;
}
.lnk-gfg:hover { background: rgba(47,141,70,.25); }

.diff {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .5px;
  padding: 2px 6px;
  border-radius: 4px;
  flex-shrink: 0;
}
.diff.e { background: rgba(67,233,123,.1); color: var(--accent3); }
.diff.m { background: rgba(255,161,22,.1); color: var(--lc); }
.diff.h { background: rgba(255,107,107,.1); color: var(--accent2); }

/* EMPTY */
.empty {
  text-align: center;
  padding: 3rem 1rem;
  color: var(--text3);
}
.empty svg { margin-bottom: 1rem; opacity: .3; }
.empty p { font-size: 14px; }

/* SCROLLBAR */
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* MOBILE */
@media (max-width: 768px) {
  .sidebar { display: none; }
  .header-top { flex-wrap: wrap; gap: .5rem; }
  .header-stats {
    display: flex;
    flex-wrap: wrap;
    width: 100%;
    gap: 6px;
    margin-top: .25rem;
  }
  .dashboard-card {
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
    padding: 10px 12px;
  }
  .motivation-text { font-size: 11.5px; }
  .mini-stats { width: 100%; justify-content: space-between; }
  .filter-group { flex-wrap: wrap; }
  .star-btn { width: 30px; height: 30px; font-size: 17px; }
  .solved-date { font-size: 9.5px; }
  .prob-title { font-size: 12.5px; }
}
</style>
</head>
<body>

<header class="header">
  <div class="header-top">
    <div class="logo">
      <div class="logo-icon">DSA</div>
      <div class="logo-text">
        <h1>DSA Patterns Cheat Sheet Tracker</h1>
        <p id="header-sub">184 problems · pattern-based practice</p>
      </div>
    </div>
    <div class="header-stats">
      <div class="stat-pill done">✓ <span class="num" id="s-done">0</span> done</div>
      <div class="stat-pill rem">◎ <span class="num" id="s-rem">184</span> left</div>
      <div class="stat-pill streak">🔥 <span class="num" id="s-streak">0</span></div>
      <div class="stat-pill maxstreak">🏆 <span class="num" id="s-maxstreak">0</span></div>
      <div class="stat-pill star">⭐ <span class="num" id="s-star">0</span></div>
      <div class="stat-pill pct">⚡ <span class="num" id="s-pct">0%</span></div>
    </div>
  </div>
  <div class="progress-track">
    <div class="progress-fill" id="prog-fill" style="width:0%"></div>
  </div>
  <div class="dashboard-card" id="dashboard-card">
    <div class="streak-badge">
      <span class="streak-flame">🔥</span>
      <div class="streak-badge-text">
        <span class="streak-num" id="dash-streak-num">0</span>
        <span class="streak-label">day streak</span>
      </div>
    </div>
    <div class="motivation-text" id="dash-message">🚀 Start with just ONE problem today. Consistency beats intensity.</div>
    <div class="mini-stats">
      <div class="today-stat">Today<span class="num" id="dash-today-num">0</span></div>
      <div class="activity-squares" id="activity-squares"></div>
    </div>
  </div>
  <div class="controls">
    <div class="search-wrap">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="search" placeholder="Search problems by name or number...">
    </div>
    <div class="filter-group">
      <button class="fbtn on" id="f-all" onclick="setFilter('all')">All</button>
      <button class="fbtn" id="f-pend" onclick="setFilter('pending')">Pending</button>
      <button class="fbtn" id="f-done" onclick="setFilter('done')">Done</button>
      <button class="fbtn" id="f-star" onclick="setFilter('starred')">⭐ Starred</button>
    </div>
    <button class="reset-btn" onclick="resetAll()">↺ Reset</button>
  </div>
</header>

<div class="main">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="content" id="content"></div>
</div>

<script>
const DATA = [
{id:1, name:"Pattern 1: Two Pointers", problems:[
{n:1,t:"Pair with Target Sum",diff:"e",l:"https://leetcode.com/problems/two-sum-ii-input-array-is-sorted/description/",g:""},
{n:2,t:"Rearrange 0 and 1",diff:"m",l:"",g:"https://www.geeksforgeeks.org/problems/segregate-0s-and-1s5106/1"},
{n:3,t:"Remove Duplicates from Sorted List",diff:"e",l:"https://leetcode.com/problems/remove-duplicates-from-sorted-list/",g:""},
{n:4,t:"Remove Duplicates from Sorted Array",diff:"e",l:"https://leetcode.com/problems/remove-duplicates-from-sorted-array/description/",g:""},
{n:5,t:"Remove Duplicates from Sorted Array II",diff:"m",l:"https://leetcode.com/problems/remove-duplicates-from-sorted-array-ii/",g:""},
{n:6,t:"Squaring a Sorted Array",diff:"e",l:"https://leetcode.com/problems/squares-of-a-sorted-array/",g:""},
{n:7,t:"Triplet Sum to Zero",diff:"m",l:"https://leetcode.com/problems/3sum/",g:""},
{n:8,t:"Triplet Sum Close to Target",diff:"m",l:"https://leetcode.com/problems/3sum-closest/",g:""},
{n:9,t:"Triplets with Smaller Sum",diff:"m",l:"",g:"https://www.geeksforgeeks.org/problems/count-triplets-with-sum-smaller-than-x5549/1"},
{n:10,t:"Subarrays with Product Less than a Target",diff:"m",l:"https://leetcode.com/problems/subarray-product-less-than-k/",g:""},
{n:11,t:"Dutch National Flag Problem",diff:"m",l:"https://leetcode.com/problems/sort-colors/description/",g:""},
{n:12,t:"Problem Challenge 1: Quadruple Sum to Target",diff:"m",l:"https://leetcode.com/problems/4sum/",g:""},
{n:13,t:"Problem Challenge 2: Comparing Strings containing Backspaces",diff:"m",l:"https://leetcode.com/problems/backspace-string-compare/",g:""},
{n:14,t:"Problem Challenge 3: Minimum Window Sort",diff:"m",l:"https://leetcode.com/problems/shortest-unsorted-continuous-subarray/",g:""}
]},
{id:2, name:"Pattern 2: Fast & Slow Pointers", problems:[
{n:15,t:"LinkedList Cycle",diff:"e",l:"https://leetcode.com/problems/linked-list-cycle/",g:""},
{n:16,t:"Start of LinkedList Cycle",diff:"m",l:"https://leetcode.com/problems/linked-list-cycle-ii/",g:""},
{n:17,t:"Happy Number",diff:"m",l:"https://leetcode.com/problems/happy-number/",g:""},

{n:177,t:"Episode 10: Longest Increasing Subsequence",diff:"m",l:"https://leetcode.com/problems/longest-increasing-subsequence/",g:""},
{n:178,t:"Episode 12: Longest Common Subsequence",diff:"m",l:"https://leetcode.com/problems/longest-common-subsequence/description/",g:""},
{n:179,t:"Episode 13: Unique Paths",diff:"m",l:"https://leetcode.com/problems/unique-paths/description/",g:""},
{n:180,t:"Episode 14: Best Time to Buy and Sell Stock",diff:"e",l:"https://leetcode.com/problems/best-time-to-buy-and-sell-stock/description/",g:""},
{n:181,t:"Episode 14: Best Time to Buy and Sell Stock II",diff:"m",l:"https://leetcode.com/problems/best-time-to-buy-and-sell-stock-ii/description/",g:""},
{n:182,t:"Episode 14: Best Time to Buy and Sell Stock III",diff:"h",l:"https://leetcode.com/problems/best-time-to-buy-and-sell-stock-iii/description/",g:""},
{n:183,t:"Episode 14: Best Time to Buy and Sell Stock IV",diff:"h",l:"https://leetcode.com/problems/best-time-to-buy-and-sell-stock-iv/description/",g:""},
{n:184,t:"Episode 15: Minimum Cost to Cut a Stick",diff:"h",l:"https://leetcode.com/problems/minimum-cost-to-cut-a-stick/",g:""}
]}
];

/* ======================================================================
   STATE / STORAGE
   ====================================================================== */

const STORAGE_KEY_V1 = 'dsa_patterns_progress_v1';   // legacy: { "23": true, ... }
const STORAGE_KEY_V2 = 'dsa_patterns_progress_v2';   // current versioned model

// state.problems[n] = { done, firstSolvedDate, completedOn, starred }
// state.collapsedSteps[stepId] = true  -> that pattern section is collapsed
let state = { version: 2, problems: {}, maxStreak: 0, collapsedSteps: {} };
let filter = 'all';
let activeStep = 'all';

function emptyProblemState() {
  return { done: false, firstSolvedDate: null, completedOn: null, starred: false };
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY_V2, JSON.stringify(state));
  } catch(e) {}
}

function loadState() {
  try {
    const rawV2 = localStorage.getItem(STORAGE_KEY_V2);
    if(rawV2) {
      const parsed = JSON.parse(rawV2);
      if(parsed && parsed.problems) {
        state = {
          version: 2,
          problems: parsed.problems || {},
          maxStreak: typeof parsed.maxStreak === 'number' ? parsed.maxStreak : 0,
          collapsedSteps: parsed.collapsedSteps && typeof parsed.collapsedSteps === 'object' ? parsed.collapsedSteps : {}
        };
        return;
      }
    }

    // No v2 data yet — attempt one-time migration from legacy boolean map.
    const rawV1 = localStorage.getItem(STORAGE_KEY_V1);
    if(rawV1) {
      const oldDone = JSON.parse(rawV1) || {};
      const migrated = { version: 2, problems: {}, maxStreak: 0, collapsedSteps: {} };
      Object.keys(oldDone).forEach(k => {
        if(oldDone[k]) {
          // Historical date is unknown for migrated entries — never invent one.
          migrated.problems[k] = { done: true, firstSolvedDate: null, completedOn: null, starred: false };
        }
      });
      state = migrated;
      saveState(); // persist migrated v2 copy; legacy v1 key is left untouched
      return;
    }

    state = { version: 2, problems: {}, maxStreak: 0, collapsedSteps: {} };
  } catch(e) {
    state = { version: 2, problems: {}, maxStreak: 0, collapsedSteps: {} };
  }
}

/* ======================================================================
   HELPERS
   ====================================================================== */

function getProblemState(n) {
  return state.problems[n] || emptyProblemState();
}

function isProblemDone(n) { return !!getProblemState(n).done; }
function isProblemStarred(n) { return !!getProblemState(n).starred; }

function getTodayKey() { return dateKeyFromDate(new Date()); }

function dateKeyFromDate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function formatDate(dateKey) {
  if(!dateKey) return '';
  const [y, m, d] = dateKey.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${months[dt.getMonth()]} ${dt.getDate()}, ${dt.getFullYear()}`;
}

// Derived purely from CURRENTLY done problems' completedOn dates.
// Unchecking a problem removes its date's contribution automatically.
function getDailyActivity() {
  const map = {};
  Object.values(state.problems).forEach(ps => {
    if(ps.done && ps.completedOn) {
      map[ps.completedOn] = (map[ps.completedOn] || 0) + 1;
    }
  });
  return map;
}

function calculateCurrentStreak(activity) {
  activity = activity || getDailyActivity();
  let streak = 0;
  let d = new Date();
  while(true) {
    const key = dateKeyFromDate(d);
    if(activity[key] > 0) {
      streak++;
      d.setDate(d.getDate() - 1);
    } else {
      break;
    }
  }
  return streak;
}

// Longest run ever recorded. Persisted so it never drops if a past
// completion is later unchecked — "highest ever achieved" is permanent.
function calculateMaxStreak(activity) {
  activity = activity || getDailyActivity();
  const keys = Object.keys(activity).filter(k => activity[k] > 0).sort();

  let longestInCurrentData = 0, run = 0, prevDate = null;
  keys.forEach(k => {
    const [y, m, d] = k.split('-').map(Number);
    const cur = new Date(y, m - 1, d);
    if(prevDate) {
      const diffDays = Math.round((cur - prevDate) / 86400000);
      run = diffDays === 1 ? run + 1 : 1;
    } else {
      run = 1;
    }
    longestInCurrentData = Math.max(longestInCurrentData, run);
    prevDate = cur;
  });

  const currentStreak = calculateCurrentStreak(activity);
  const best = Math.max(longestInCurrentData, currentStreak, state.maxStreak || 0);
  if(best > (state.maxStreak || 0)) {
    state.maxStreak = best;
    saveState();
  }
  return state.maxStreak || 0;
}

function getTodaySolvedCount(activity) {
  activity = activity || getDailyActivity();
  return activity[getTodayKey()] || 0;
}

function getMotivationMessage(currentStreak, doneCount, total) {
  if(total > 0 && doneCount === total) return `🏆 ${total}/${total} — You finished the tracker. Now revise the starred problems.`;
  if(doneCount === 0) return `🚀 Start with just ONE problem today. Consistency beats intensity.`;
  if(currentStreak === 0) return `🔄 Yesterday was history. Start again today with one problem.`;
  if(currentStreak <= 2) return `🔥 You're building the habit. Don't break the chain.`;
  if(currentStreak <= 6) return `💪 Discipline is forming. Keep showing up.`;
  if(currentStreak <= 13) return `⚡ One week strong. Your consistency is becoming a skill.`;
  if(currentStreak <= 29) return `🏆 Two weeks+ of discipline. Keep pushing.`;
  return `👑 30+ day streak. This is serious consistency.`;
}

function totalProbs() {
  let t = 0;
  DATA.forEach(s => t += s.problems.length);
  return t;
}

function doneProbsForStep(step) {
  return step.problems.filter(p => isProblemDone(p.n)).length;
}

/* ======================================================================
   STATE MUTATIONS
   ====================================================================== */

function toggleProblem(n, checked) {
  const ps = Object.assign(emptyProblemState(), state.problems[n]);
  if(checked) {
    ps.done = true;
    const today = getTodayKey();
    if(!ps.firstSolvedDate) ps.firstSolvedDate = today; // never overwrite original
    ps.completedOn = today;
  } else {
    ps.done = false;
    ps.completedOn = null; // firstSolvedDate is preserved permanently
  }
  state.problems[n] = ps;
  saveState();
  refreshAll();
}

function toggleStar(n, evt) {
  if(evt) evt.stopPropagation();
  const ps = Object.assign(emptyProblemState(), state.problems[n]);
  ps.starred = !ps.starred;
  state.problems[n] = ps;
  saveState();
  refreshAll();
}

function resetAll() {
  if(!confirm('Reset all DSA progress, dates, stars and streak history? This cannot be undone.')) return;
  state = { version: 2, problems: {}, maxStreak: 0, collapsedSteps: state.collapsedSteps || {} };
  saveState();
  filter = 'all';
  document.querySelectorAll('.fbtn').forEach(b => b.classList.remove('on','on-done','on-pend','on-star'));
  const allBtn = document.getElementById('f-all');
  if(allBtn) allBtn.classList.add('on');
  refreshAll();
}

/* ======================================================================
   RENDERING
   ====================================================================== */

function buildSidebar() {
  const sb = document.getElementById('sidebar');
  const total = totalProbs();
  let h = `<div class="sidebar-title">Jump to pattern</div>`;
  h += `<button class="step-btn on" onclick="jumpToStep('all',this)"><span class="step-name">All Patterns</span><span class="step-count">${total}</span></button>`;
  DATA.forEach((s) => {
    const cnt = s.problems.length;
    const doneC = doneProbsForStep(s);
    h += `<button class="step-btn" onclick="jumpToStep(${s.id},this)"><span class="step-name">${s.name.replace(/^Pattern\s*\d*:?\s*/,'').replace(/^Pattern:\s*/,'')}</span><span class="step-count">${doneC}/${cnt}</span></button>`;
  });
  sb.innerHTML = h;
}

function jumpToStep(id, el) {
  document.querySelectorAll('.step-btn').forEach(b => b.classList.remove('on'));
  el.classList.add('on');
  activeStep = id === 'all' ? 'all' : id;
  renderContent();
}

function setFilter(f) {
  filter = f;
  document.querySelectorAll('.fbtn').forEach(b => b.classList.remove('on','on-done','on-pend','on-star'));
  const _fmap = {all:'f-all', done:'f-done', pending:'f-pend', starred:'f-star'};
  const el = document.getElementById(_fmap[f] || 'f-all');
  if(f==='all') el.classList.add('on');
  else if(f==='done') el.classList.add('on-done');
  else if(f==='pending') el.classList.add('on-pend');
  else if(f==='starred') el.classList.add('on-star');
  renderContent();
}

function updateStats() {
  const total = totalProbs();
  const d = Object.values(state.problems).filter(p => p.done).length;
  const starred = Object.values(state.problems).filter(p => p.starred).length;
  const pct = total ? Math.round((d/total)*100) : 0;
  document.getElementById('s-done').textContent = d;
  document.getElementById('s-rem').textContent = total - d;
  document.getElementById('s-pct').textContent = pct + '%';
  document.getElementById('s-star').textContent = starred;
  document.getElementById('prog-fill').style.width = pct + '%';
}

function updateDashboard() {
  const activity = getDailyActivity();
  const currentStreak = calculateCurrentStreak(activity);
  const maxStreak = calculateMaxStreak(activity);
  const today = getTodaySolvedCount(activity);
  const doneCount = Object.values(state.problems).filter(p => p.done).length;
  const total = totalProbs();

  document.getElementById('s-streak').textContent = currentStreak;
  document.getElementById('s-maxstreak').textContent = maxStreak;
  document.getElementById('dash-streak-num').textContent = currentStreak;
  document.getElementById('dash-today-num').textContent = today;
  document.getElementById('dash-message').textContent = getMotivationMessage(currentStreak, doneCount, total);

  const sqWrap = document.getElementById('activity-squares');
  let sqHtml = '';
  for(let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    const key = dateKeyFromDate(d);
    const count = activity[key] || 0;
    let level = 0;
    if(count >= 1) level = 1;
    if(count >= 3) level = 2;
    if(count >= 5) level = 3;
    const dayLabel = d.toLocaleDateString('en-US', { weekday: 'short' });
    const isToday = i === 0;
    sqHtml += `<div class="activity-sq${isToday?' today':''}" data-level="${level}" title="${dayLabel}: ${count} solved"></div>`;
  }
  sqWrap.innerHTML = sqHtml;
}

function renderContent() {
  const q = document.getElementById('search').value.toLowerCase().trim();
  const content = document.getElementById('content');
  let html = '';
  let totalVisible = 0;

  DATA.forEach(step => {
    if(activeStep !== 'all' && step.id !== activeStep) return;

    let probs = step.problems.filter(p => {
      const ps = getProblemState(p.n);
      const matchQ = !q || p.t.toLowerCase().includes(q) || String(p.n).includes(q);
      const matchF = filter === 'all'
        || (filter === 'done' && ps.done)
        || (filter === 'pending' && !ps.done)
        || (filter === 'starred' && ps.starred);
      return matchQ && matchF;
    });

    if(probs.length === 0) return;
    totalVisible += probs.length;

    const doneC = doneProbsForStep(step);
    const pct = Math.round((doneC / step.problems.length)*100);
    const isCollapsed = !!state.collapsedSteps[step.id];

    html += `<div class="step-section${isCollapsed?' collapsed':''}" id="step-${step.id}">
      <div class="step-header" onclick="toggleCollapse(${step.id})">
        <span class="step-num">P${step.id}</span>
        <span class="step-title">${step.name}</span>
        <span class="step-progress-text">${doneC}/${step.problems.length}</span>
        <div class="step-mini-bar"><div class="step-mini-fill" style="width:${pct}%"></div></div>
        <svg class="step-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
      </div>
      <div class="problems-list">`;

    probs.forEach(p => {
      const ps = getProblemState(p.n);
      const isDone = ps.done;
      const isStarred = ps.starred;
      const diffClass = p.diff === 'e' ? 'e' : p.diff === 'm' ? 'm' : 'h';
      const diffLabel = p.diff === 'e' ? 'Easy' : p.diff === 'm' ? 'Med' : 'Hard';

      let links = '';
      if(p.l) links += `<a class="lnk lnk-lc" href="${p.l}" target="_blank" rel="noopener">LC ↗</a>`;
      if(p.g) links += `<a class="lnk lnk-gfg" href="${p.g}" target="_blank" rel="noopener">GFG ↗</a>`;

      const dateHtml = (isDone && ps.firstSolvedDate)
        ? `<span class="solved-date" title="First solved ${formatDate(ps.firstSolvedDate)}">Solved ${formatDate(ps.firstSolvedDate)}</span>`
        : '';

      html += `<div class="prob${isDone?' done':''}" id="prob-${p.n}">
        <div class="cb-wrap"><input type="checkbox" ${isDone?'checked':''} onchange="toggleProblem(${p.n}, this.checked)"></div>
        <button type="button" class="star-btn${isStarred?' starred':''}" onclick="toggleStar(${p.n}, event)" title="Mark as Important" aria-label="Star problem ${p.n}">${isStarred?'★':'☆'}</button>
        <span class="prob-num">${p.n}</span>
        <div class="prob-name">
          <span class="prob-title">${p.t}</span>
          ${dateHtml}
        </div>
        <span class="diff ${diffClass}">${diffLabel}</span>
        <div class="links">${links}</div>
      </div>`;
    });

    html += `</div></div>`;
  });

  if(totalVisible === 0) {
    let msg = 'No problems found';
    if(filter === 'starred') {
      msg = q ? 'No starred problems match your search.' : 'No starred problems yet. Star the questions you want to revisit.';
    }
    html = `<div class="empty"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg><p>${msg}</p></div>`;
  }

  content.innerHTML = html;
}

function toggleCollapse(id) {
  const el = document.getElementById('step-'+id);
  el.classList.toggle('collapsed');
  if(el.classList.contains('collapsed')) {
    state.collapsedSteps[id] = true;
  } else {
    delete state.collapsedSteps[id];
  }
  saveState();
}

function refreshAll() {
  renderContent();
  updateStats();
  updateDashboard();
  buildSidebar();
}

function init() {
  loadState();
  buildSidebar();
  renderContent();
  updateStats();
  updateDashboard();
}

document.getElementById('search').addEventListener('input', renderContent);

init();
</script>
